<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>球场档案｜今日模型</title><link rel="stylesheet" href="styles.css"></head><body><div class="shell">
<header class="header"><div class="brand">球场档案<span>·模型观察</span></div><button class="menu-btn" id="menuBtn">☰</button></header>
<div class="ticker"><div class="ticker-track">模型数据每日固定时段更新；临近开赛场次将根据最新阵容与市场信息进行赛前刷新。</div></div>
<main class="content">
<div class="jc-date-nav">
  <div class="date-switch">
    <button id="jcPrevDate" type="button" aria-label="上一天">◀</button>
    <button id="jcDateLabel" class="date-label-btn" type="button">读取日期…</button>
    <button id="jcNextDate" type="button" aria-label="下一天">▶</button>
  </div>
  <button id="jcTodayBtn" class="jc-today-btn" type="button">回到今日</button>
  <div id="jcDatePopover" class="jc-date-popover" hidden></div>
</div>
<section class="jc-fixtures-shell">
  <div class="jc-fixture-toolbar">
    <div id="jcLeagueFilters" class="jc-league-filters"><button class="active" type="button">全部</button></div>
    <div class="jc-fixture-count" id="jcDateCount">正在读取…</div>
  </div>
  <div class="section-title" id="jcLiveTitle"><span class="bar" style="background:var(--green)"></span><span id="jcSectionTitleText">官方竞彩足球</span><span class="section-meta" id="jcLiveMeta">正在读取…</span></div>
  <div class="jc-live-cards" id="jcLiveCards"><div class="profile-card">正在读取官方竞彩数据…</div></div>
</section>
<div class="section-title qc-demo-section"><span class="bar"></span><span>昨日回收</span><span class="section-meta">09-20 · 5场演示</span></div>
<div class="table-card qc-demo-section"><table class="brief-table"><thead><tr><th>#</th><th>时间</th><th>赛事</th><th>对阵/比分</th><th>方向</th><th>进球</th><th>半全场</th></tr></thead><tbody id="recapRows"></tbody></table></div>
<div class="section-title qc-demo-section" style="margin-top:34px"><span class="bar" style="background:var(--blue)"></span><span>今日模型</span><span class="section-meta">09-21 · 4场演示</span></div><div class="cards qc-demo-section" id="matchCards"></div>
</main><div class="footer-note">本页面用于体育数据研究、赛前模型推演与赛后复盘，不承诺任何结果。请理性使用数据并遵守所在地适用规则。</div>
</div>
