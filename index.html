<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>球场档案｜赛事数据管家</title><link rel="stylesheet" href="styles.css?v=20260922compact1"></head><body class="qc-home"><div class="shell">
<header class="header"><div class="brand">球场档案<span>·赛事数据管家</span></div><button class="menu-btn" id="menuBtn">☰</button></header>
<div class="ticker"><div class="ticker-track">赛事数据持续更新；临近开赛与完赛后将自动补充最新赛况。</div></div>
<main class="content">
<div class="jc-home-controls">
  <div class="jc-date-nav">
    <div class="date-switch">
      <button id="jcPrevDate" type="button" aria-label="上一天">◀</button>
      <button id="jcDateLabel" class="date-label-btn" type="button">读取日期…</button>
      <button id="jcNextDate" type="button" aria-label="下一天">▶</button>
    </div>
    <button id="jcTodayBtn" class="jc-today-btn" type="button">今日</button>
    <button id="jcLeagueToggle" class="jc-league-toggle" type="button">赛事</button>
    <div id="jcDatePopover" class="jc-date-popover" hidden></div>
    <div id="jcLeaguePopover" class="jc-league-popover" hidden>
      <div class="jc-league-popover-title">选择赛事</div>
      <div id="jcLeagueFilters" class="jc-league-filters"></div>
    </div>
  </div>
</div>
<section class="jc-fixtures-shell">
  <div class="section-title jc-home-section-title" id="jcLiveTitle">
    <span class="bar" style="background:var(--green)"></span>
    <span id="jcSectionTitleText">今日赛事</span>
    <span class="section-meta" id="jcLiveMeta">正在读取…</span>
    <span class="jc-fixture-count" id="jcDateCount">—</span>
  </div>
  <div class="jc-live-cards" id="jcLiveCards"><div class="profile-card">正在读取官方竞彩数据…</div></div>
</section>
</main><div class="footer-note">本页面用于体育数据研究、赛前模型推演与赛后复盘，不承诺任何结果。请理性使用数据并遵守所在地适用规则。</div>
</div>
