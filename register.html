<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>球场档案｜注册</title>
  <link rel="stylesheet" href="styles.css?v=20260922livetime1">
</head>
<body>
  <main class="auth-wrap">
    <form class="auth-card" id="registerForm">
      <h1>球场档案</h1>
      <div class="subtitle">赛事数据管家 · 创建账号</div>
      <div class="code-hint success" style="margin:10px 0 18px">新注册账号自动赠送 1 天 Pro 体验</div>

      <div class="field">
        <label for="regEmail">邮箱</label>
        <input id="regEmail" type="email" required autocomplete="email" placeholder="请输入邮箱">
      </div>

      <div class="field">
        <label for="regPassword">密码</label>
        <input id="regPassword" type="password" minlength="8" required autocomplete="new-password" placeholder="至少8个字符">
      </div>

      <div class="field">
        <label for="regPassword2">确认密码</label>
        <input id="regPassword2" type="password" minlength="8" required autocomplete="new-password" placeholder="再次输入密码">
      </div>

      <label class="check">
        <input type="checkbox" required>
        <span>我已阅读并同意 <a class="legal-link" href="terms.html" target="_blank" rel="noopener">《用户服务协议》</a> 和 <a class="legal-link" href="privacy.html" target="_blank" rel="noopener">《隐私政策》</a></span>
      </label>

      <button class="primary-btn" type="submit">注册</button>
      <div id="registerHint" class="code-hint"></div>
      <div class="auth-link">已有账号？ <a href="login.html">立即登录</a></div><div class="auth-link"><a href="index.html">返回首页</a></div>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-client.js"></script>
  <script src="app.js?v=20260927silky1"></script>
</body>
</html>
