<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://oqtloldkfjxildoribkf.supabase.co" crossorigin>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>球场档案｜注册</title>
  <link rel="stylesheet" href="styles.css?v=20261024ux20261024">
  <link rel="stylesheet" href="register-page.css?v=20261019register2">
</head>
<body class="auth-register-page">
  <main class="auth-wrap">
    <form class="auth-card" id="registerForm">
      <a class="qc-register-back" href="index.html">← 返回首页</a>

      <div class="qc-register-heading">
        <div class="qc-register-brand">球场档案</div>
        <h1>创建账号</h1>
        <div class="subtitle">赛事数据管家 · 注册后开启赛事研究之旅</div>
      </div>

      <div class="qc-register-benefit">
        <span class="qc-register-benefit-tag">新用户</span>
        <span>注册成功自动赠送 1 天 Pro 体验</span>
      </div>

      <div class="field">
        <label for="regEmail">邮箱地址</label>
        <input id="regEmail" type="email" required autocomplete="email" inputmode="email" placeholder="请输入邮箱">
      </div>

      <div class="field">
        <label for="regPassword">设置密码</label>
        <input id="regPassword" type="password" minlength="8" required autocomplete="new-password" placeholder="至少 8 位字符">
      </div>

      <div class="field">
        <label for="regPassword2">确认密码</label>
        <input id="regPassword2" type="password" minlength="8" required autocomplete="new-password" placeholder="请再次输入密码">
      </div>

      <label class="check qc-register-agreement">
        <input type="checkbox" required>
        <span>我已阅读并同意 <a class="legal-link" href="terms.html" target="_blank" rel="noopener">《用户服务协议》</a> 和 <a class="legal-link" href="privacy.html" target="_blank" rel="noopener">《隐私政策》</a></span>
      </label>

      <button class="primary-btn" type="submit">注册</button>
      <div id="registerHint" class="code-hint" aria-live="polite"></div>

      <div class="qc-register-footer">
        <span>已有账号？</span>
        <a href="login.html">立即登录</a>
      </div>
    </form>
  </main>

  <script src="assets/vendor/supabase-js-2.117.3.js"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-client.js?v=20260927autologin1"></script>
  <script src="app.js?v=20261028homeauthfast3"></script>
</body>
</html>
