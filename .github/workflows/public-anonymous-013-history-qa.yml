name: Public anonymous 013 history QA
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/public-anonymous-013-history-qa.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          mkdir -p /tmp/qc-guest-013
          cd /tmp/qc-guest-013
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Confirm 013 appears for anonymous website visitors
        shell: bash
        run: |
          cat > /tmp/qc-guest-013/check.cjs <<'JS'
          const {chromium,devices}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            try {
              for (const [device,opts] of [['desktop',{viewport:{width:1200,height:900}}],['mobile',devices['iPhone 13']]]) {
                const context=await browser.newContext({...opts,locale:'zh-CN',timezoneId:'Asia/Shanghai'});
                const page=await context.newPage();
                const failures=[];page.on('pageerror',e=>failures.push(String(e)));
                await page.goto('https://qcda.cn/?qa_public_013_20261022=1',{waitUntil:'domcontentloaded',timeout:45000});
                const row=page.locator('#jcYesterdayCards tr[data-match-id="8c682030-ce2e-4c50-b2ed-d68c6ad50be2"]');
                await row.waitFor({state:'visible',timeout:45000});
                const text=await row.innerText();
                const count=await page.locator('#jcYesterdayCards tbody tr.jc-overview-row').count();
                const meta=await page.locator('#jcYesterdayMeta').innerText();
                console.log(JSON.stringify({device,count,meta,row:text}));
                if(count!==13||!text.includes('013')||!text.includes('0-1')||!text.includes('半 0-0')) throw Error('GUEST_013_INCOMPLETE '+device);
                if(failures.length) throw Error('GUEST_JS_ERROR '+failures.join(' / '));
                await context.close();
              }
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
          cd /tmp/qc-guest-013
          node check.cjs
