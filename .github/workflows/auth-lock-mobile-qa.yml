name: Mobile login auth lock and cache QA
on:
  push:
    paths:
      - 'app.js'
      - 'home-auth-prime.js'
      - 'login.html'
      - 'login-fast.js'
      - 'scripts/login_fast_qa_20261028.cjs'
      - 'index.html'
      - 'football.html'
      - 'league.html'
      - 'jc-match.html'
      - 'profile.html'
      - 'register.html'
      - 'forgot-password.html'
      - 'reset-password.html'
      - 'verify.html'
      - 'scripts/auth_lock_mobile_qa_20261028.cjs'
      - 'scripts/shared_session_admin_isolation_qa_20261028.cjs'
      - 'scripts/home_auth_deadline_qa_20261028.cjs'
      - 'scripts/home_auth_prime_qa_20261028.cjs'
      - 'scripts/home_member_retry_qa_20261029.cjs'
      - 'scripts/cross_platform_login_handoff_qa_20261029.cjs'
      - 'scripts/home_schedule_firstpaint_deadline_qa_20261028.cjs'
      - 'scripts/home_static_review_slim_qa_20261029.cjs'
      - '.github/workflows/auth-lock-mobile-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Login storage/lock race and cache reuse
        run: node --test scripts/auth_lock_mobile_qa_20261028.cjs
      - name: Lightweight login functional QA
        run: node --test scripts/login_fast_qa_20261028.cjs
      - name: Shared-session and admin-isolation regression
        run: node --test scripts/shared_session_admin_isolation_qa_20261028.cjs
      - name: Homepage early session and immediate verified-state QA
        run: node --test scripts/home_auth_prime_qa_20261028.cjs
      - name: Home auth never waits indefinitely or bypasses server entitlements
        run: node --test scripts/home_auth_deadline_qa_20261028.cjs
      - name: Recovery from stalled SDK and one-time membership recheck
        run: node --test scripts/home_member_retry_qa_20261029.cjs
      - name: iOS Android desktop login redirect and session handoff regression
        run: node --test scripts/cross_platform_login_handoff_qa_20261029.cjs
      - name: Public current-day static fallback never blocks homepage forever
        run: node --test scripts/home_schedule_firstpaint_deadline_qa_20261028.cjs
      - name: Homepage pre-rendered FINAL remains instant with no duplicate static readers
        run: node --test scripts/home_static_review_slim_qa_20261029.cjs
      - name: Check full application JavaScript syntax
        run: node --check app.js && node --check home-auth-prime.js
