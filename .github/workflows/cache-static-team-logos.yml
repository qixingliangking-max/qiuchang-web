name: Cache immutable fixture team logos

on:
  workflow_dispatch:
  schedule:
    # During the live fixture window, publish public score/status changes
    # approximately every 10 minutes, including late-night Beijing fixtures.
    # Completed historical archives are immutable and not rebuilt here.
    - cron: '3,13,23,33,43,53 * * * *'
  push:
    paths:
      - 'scripts/cache_static_team_logos.py'
      - 'data/overview/manifest.json'
      - 'data/overview/*.json'
      - '!data/overview/live-schedule-manifest.json'
      - '.github/workflows/cache-static-team-logos.yml'

permissions:
  contents: write

concurrency:
  group: qcda-immutable-team-crests
  cancel-in-progress: false

jobs:
  cache-crests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out public website content
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache newly discovered team logos from public schedules
        run: python3 scripts/cache_static_team_logos.py

      - name: Publish immutable binary images and updated static catalog
        shell: bash
        run: |
          set -euo pipefail
          git add assets/team-logos/ data/team-logos/catalog.json data/overview/live/ data/overview/live-schedule-manifest.json
          if git diff --cached --quiet; then
            echo 'No new teams or crest files. Nothing to publish.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "assets(team-logos): archive newly discovered static crest files"
          git pull --rebase origin main
          git push origin HEAD:main
