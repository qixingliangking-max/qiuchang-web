name: Cache immutable fixture team logos

on:
  workflow_dispatch:
  # Fallback publication trigger when GitHub delays this workflow's cron.
  # The completed score workflow runs frequently and never depends on this one.
  workflow_run:
    workflows: ["Publish confirmed final scores into static fixture file"]
    types: [completed]
    branches: [main]
  schedule:
    # Static fixture/crest publication is independent of dynamic live scores.
    # Beijing daytime: ingest newly discovered fixture identities and crests.
    - cron: '7,22,37,52 3-11 * * *'
    # Off-peak: check for new fixture assets, NOT to update match scores.
    - cron: '19 0-2,12-23 * * *'
  push:
    paths:
      - 'scripts/cache_static_team_logos.py'
      - 'app.js'
      - 'scripts/prerender_public_football.cjs'
      - 'scripts/football_prerender_qa_20261029.cjs'
      - 'football.html'
      - 'data/overview/manifest.json'
      - 'data/overview/*.json'
      - '!data/overview/live-schedule-manifest.json'
      - '.github/workflows/cache-static-team-logos.yml'

permissions:
  contents: write

concurrency:
  group: qcda-immutable-team-crests
  cancel-in-progress: false

jobs:
  cache-crests:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out public website content
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify odds are mutable before kickoff only
        run: python3 scripts/cache_static_team_logos.py --self-test

      - name: Cache newly discovered team logos from public schedules
        run: python3 scripts/cache_static_team_logos.py

      - name: Audit every published schedule crest and local binary
        run: python3 scripts/cache_static_team_logos.py --audit

      - name: Pre-render today's public football HTML before deploying
        run: |
          node scripts/prerender_public_football.cjs
          node --test scripts/football_prerender_qa_20261029.cjs

      - name: Publish immutable binary images and updated static catalog
        shell: bash
        run: |
          set -euo pipefail
          git add assets/team-logos/ data/team-logos/catalog.json data/overview/live/ data/overview/live-schedule-manifest.json football.html
          if git diff --cached --quiet; then
            echo 'No new teams or crest files. Nothing to publish.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "assets(team-logos): archive newly discovered static crest files"
          git pull --rebase origin main
          git push origin HEAD:main
