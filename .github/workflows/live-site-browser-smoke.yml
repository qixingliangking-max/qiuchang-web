name: Live site mobile browser smoke test
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/live-site-browser-smoke.yml'
      - 'app.js'
      - 'overview-live-static.js'
      - 'index.html'
      - 'football.html'
permissions:
  contents: read
concurrency:
  group: qcda-live-browser-smoke
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install isolated browser test tools
        shell: bash
        run: |
          mkdir -p /tmp/qcda-smoke
          cd /tmp/qcda-smoke
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Visit LIVE website and CLICK two detail entry paths
        shell: bash
        run: |
          cat > /tmp/qcda-smoke/check.cjs <<'JS'
          const {chromium,webkit,devices}=require('playwright');
          const fs=require('fs');
          const BASE='https://qcda.cn';
          const results=[];
          async function visit(browser,engine,entry,selector){
            const context=await browser.newContext({...engine.device,locale:'zh-CN'});
            const page=await context.newPage();
            const exceptions=[],failedRequests=[];
            const requests=new Map(),slowRequests=[];
            page.on('pageerror',error=>exceptions.push(String(error).slice(0,300)));
            page.on('request',request=>requests.set(request,{at:Date.now(),url:new URL(request.url()).origin+new URL(request.url()).pathname}));
            page.on('requestfinished',request=>{
              const info=requests.get(request);
              if(info)slowRequests.push({path:info.url,ms:Date.now()-info.at});
            });
            page.on('requestfailed',request=>{
              const info=requests.get(request);
              failedRequests.push({path:info?.url||request.url().split('?')[0],reason:request.failure()?.errorText||''});
            });
            const start=Date.now();
            let httpStatus=null,domMs=null,listMs=null,detailHeaderMs=null,detailPanelMs=null,clickToHeaderMs=null,clickedLink=null;
            let dateLabel='',panelText='',matchText='',exception='',initialDocumentStatus='';
            try{
              const response=await page.goto(BASE+entry,{waitUntil:'domcontentloaded',timeout:45000});
              domMs=Date.now()-start;
              httpStatus=response?.status()||null;
              await page.locator(selector).first().waitFor({state:'visible',timeout:25000});
              // Guest yesterday's review is a progressive, finished-only
              // public archive: a new confirmed FT appends one match, while
              // unfinished fixtures must never appear in the guest table.
              if(entry==='/index.html'){
                const bjToday=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
                if(bjToday==='2026-10-19'){
                  await page.waitForFunction(()=>{
                    const meta=document.querySelector('#jcYesterdayMeta')?.textContent||'';
                    return /10-18\\s*[·｜]\\s*\\d+场/.test(meta);
                  },null,{timeout:30000});
                  const audit=await page.evaluate(()=>{
                    const rows=[...document.querySelectorAll('#jcYesterdayCards .jc-overview-row')];
                    const meta=document.querySelector('#jcYesterdayMeta')?.textContent||'';
                    const count=Number((meta.match(/(\\d+)场/)||[])[1]);
                    return {rows:rows.length,metaCount:count,
                      pending:rows.filter(row=>/待完赛|未开赛|\\bVS\\b/.test(row.innerText)).length,
                      noScore:rows.filter(row=>!/\\d+[-:]\\d+/.test(row.querySelector('.jc-score-full')?.textContent||'')).length};
                  });
                  if(!audit.rows || audit.metaCount!==audit.rows || audit.pending || audit.noScore)
                    throw Error('Guest finished-only history failed: '+JSON.stringify(audit));
                  console.log('QCDA_GUEST_HISTORY_FINISHED_ONLY_PASS='+JSON.stringify(audit));
                }
              }
              listMs=Date.now()-start;
              dateLabel=await page.locator('#jcDateLabel,#jcFootballDateLabel').first().textContent().catch(()=>'');
              const link=page.locator(selector).first();
              clickedLink=await link.getAttribute('href');
              const clickStart=Date.now();
              await link.click({timeout:15000});
              await page.locator('#jcMatchDetailRoot .detail-head').first().waitFor({state:'visible',timeout:30000});
              detailHeaderMs=Date.now()-start;
              clickToHeaderMs=Date.now()-clickStart;
              matchText=(await page.locator('#jcMatchDetailRoot .detail-head').first().innerText()).slice(0,240);
              await page.waitForFunction(()=>{
                const panel=document.querySelector('#jcMainPanel');
                return panel && panel.textContent && !panel.textContent.includes('正在加载中');
              },null,{timeout:25000});
              detailPanelMs=Date.now()-start;
              panelText=(await page.locator('#jcMainPanel').first().innerText().catch(()=>'')).slice(0,280);
            }catch(error){exception=String(error).slice(0,700);}
            const result={
              engine:engine.name,source:entry==='/index.html'?'今日速览→昨日回看→详情':'竞彩足球→详情',
              coldContext:true,entry,httpStatus,domMs,listMs,detailHeaderMs,clickToHeaderMs,detailPanelMs,
              clickedLink,dateLabel,matchText,panelText,exception,jsExceptions:exceptions.slice(0,12),
              failedRequests:failedRequests.slice(0,12),
              slowRequests:slowRequests.sort((a,b)=>b.ms-a.ms).slice(0,12),
              totalRequests:slowRequests.length,finalUrl:page.url()
            };
            await context.close();
            return result;
          }
          (async()=>{
            const engines=[
              {name:'android-chromium',browserType:chromium,device:devices['Pixel 7']},
              {name:'iphone-webkit',browserType:webkit,device:devices['iPhone 13']}
            ];
            for(const engine of engines){
              let browser=null;
              try{
                browser=await engine.browserType.launch({headless:true});
                for(const [entry,selector] of [
                  ['/index.html','#jcYesterdayCards a[href*="jc-match.html?id="]'],
                  ['/football.html','#jcFootballCards a.jc-card-link']
                ]){
                  const result=await visit(browser,engine,entry,selector);
                  results.push(result);
                }
              }catch(error){results.push({engine:engine.name,exception:String(error).slice(0,800)});}
              finally{if(browser)await browser.close();}
            }
            const report={testedAt:new Date().toISOString(),base:BASE,mode:'guest, production network, separate cold browser contexts, Android Chromium and Linux-hosted iPhone WebKit emulation',results};
            const bjToday=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
            if(bjToday==='2026-10-19' && results.some(row=>row.entry==='/index.html' && row.exception))
              process.exitCode=1;
            fs.mkdirSync('.github/reports',{recursive:true});
            fs.writeFileSync('.github/reports/live-site-browser-smoke.json',JSON.stringify(report,null,2)+'\n');
            console.log('QCDA_LIVE_BROWSER_TEST='+JSON.stringify(report));
            for(const row of results){
              const msg=[row.engine,row.source,'HTTP='+row.httpStatus,'DOMContentLoaded='+row.domMs+'ms','cards='+row.listMs+'ms','click-header='+row.clickToHeaderMs+'ms','panel='+row.detailPanelMs+'ms','error='+String(row.exception||'').slice(0,200)].join(' ');
              console.log('::notice title=Mobile website test::'+msg.replace(/\n/g,' '));
            }
          })().catch(error=>{console.error(error);process.exitCode=1});
          JS
          node /tmp/qcda-smoke/check.cjs
      - name: Upload standalone browser audit (no Pages rebuild)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qcda-live-browser-audit
          path: .github/reports/live-site-browser-smoke.json
          if-no-files-found: warn
          retention-days: 14

      - name: Regression - published Oct 19 public schedule must be browseable
        shell: bash
        run: |
          cat > /tmp/qcda-smoke/published-future.cjs <<'JS'
          const {chromium,webkit,devices}=require('playwright');
          const BASE='https://qcda.cn';
          (async()=>{
            const engines=[
              {name:'Android Chromium',type:chromium,device:devices['Pixel 7']},
              {name:'iPhone WebKit',type:webkit,device:devices['iPhone 13']}
            ];
            for(const engine of engines){
              const browser=await engine.type.launch({headless:true});
              try{
                const context=await browser.newContext({...engine.device,locale:'zh-CN'});
                const page=await context.newPage();
                const errors=[];
                page.on('pageerror',e=>errors.push(String(e)));
                const url=BASE+'/football.html?date=2026-10-19';
                const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});
                if(response?.status()!==200)throw Error(engine.name+' HTTP '+response?.status());
                await page.waitForFunction(()=>{
                  const label=document.querySelector('#jcFootballDateLabel');
                  const cards=document.querySelectorAll('#jcFootballCards .jc-football-card');
                  return label && /10.19/.test(label.textContent||'') && cards.length===8;
                },null,{timeout:30000});
                const roster=await page.locator('#jcFootballCards .jc-football-card').count();
                if(roster!==8)throw Error(engine.name+' missing 19 Oct static roster: '+roster);
                if(errors.length)throw Error(engine.name+' JS exceptions: '+errors.slice(0,3));
                console.log('PASS '+engine.name+' direct 2026-10-19: 8 static fixtures, no JS errors');
                const beijing=new Intl.DateTimeFormat('en-CA',{
                  timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',
                  day:'2-digit',hour:'2-digit',hourCycle:'h23'
                }).formatToParts(new Date());
                const map=Object.fromEntries(beijing.map(x=>[x.type,x.value]));
                if(map.year==='2026' && map.month==='10' && map.day==='19' && Number(map.hour)<10){
                  await page.goto(BASE+'/football.html?date=2026-10-18',{waitUntil:'domcontentloaded',timeout:45000});
                  // Wait until the 18th is fully rendered AND its navigation
                  // handlers are attached; a bare enabled HTML button can exist
                  // before async first-paint initialization.
                  await page.waitForFunction(()=>{
                    const btn=document.querySelector('#jcFootballNextDate');
                    const label=document.querySelector('#jcFootballDateLabel')?.textContent||'';
                    return btn && !btn.disabled && /10.18/.test(label) &&
                      document.querySelectorAll('#jcFootballCards .jc-football-card').length===25;
                  },null,{timeout:30000});
                  await page.locator('#jcFootballNextDate').click();
                  if((await page.locator('#jcFootballDateLabel').textContent()).includes('打开中'))
                    throw Error('Date navigation displayed forbidden opening status');
                  await page.waitForFunction(()=>{
                    const date=document.querySelector('#jcFootballDateLabel')?.textContent||'';
                    return /10.19/.test(date) &&
                      document.querySelectorAll('#jcFootballCards .jc-football-card').length===8;
                  },null,{timeout:30000});
                  console.log('PASS '+engine.name+' overnight Oct18 => Oct19 click: 8 published fixtures');
                }
                await context.close();
              }finally{await browser.close()}
            }
          })().catch(error=>{console.error(error.stack||String(error));process.exitCode=1});
          JS
          node /tmp/qcda-smoke/published-future.cjs
