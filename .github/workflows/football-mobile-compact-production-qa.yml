name: Football mobile compact production QA
on:
  workflow_dispatch:
  push:
    paths:
      - 'app.js'
      - 'football-mobile-compact.css'
      - 'football.html'
      - 'jc-match.html'
      - '.github/workflows/football-mobile-compact-production-qa.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install mobile and desktop browser engines
        run: |
          mkdir -p /tmp/qc-prod-mobile
          cd /tmp/qc-prod-mobile
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Check actual production football mobile layout, original settlement and desktop odds
        env:
          NODE_PATH: /tmp/qc-prod-mobile/node_modules
        run: |
          node <<'JS'
          const {chromium,webkit,devices}=require('playwright');
          const fs=require('fs');
          const BASE='https://qcda.cn/football.html?date=';
          (async()=>{
            const runners=[
              {name:'android',engine:chromium,device:devices['Pixel 7']},
              {name:'iphone',engine:webkit,device:devices['iPhone 13']},
              {name:'desktop',engine:chromium,device:{viewport:{width:1366,height:900}}}
            ];
            fs.mkdirSync('/tmp/qc-prod-mobile/shots',{recursive:true});
            for(const item of runners){
              const browser=await item.engine.launch({headless:true});
              try{
                const ctx=await browser.newContext({...item.device,locale:'zh-CN',timezoneId:'Asia/Shanghai'});
                const page=await ctx.newPage(),errors=[];
                page.on('pageerror',err=>errors.push(String(err)));
                const navigation=await page.goto(BASE+'2026-10-18',{waitUntil:'domcontentloaded',timeout:50000});
                if(navigation.status()!==200)throw Error(item.name+' bad status '+navigation.status());
                await page.waitForFunction(()=>document.querySelectorAll('.jc-football-card').length===25,null,{timeout:35000});
                await page.waitForFunction(()=>{
                  const imgs=[...document.querySelectorAll('.jc-football-card')[0]?.querySelectorAll('img.jc-team-logo')||[]];
                  return imgs.length===2 && imgs.every(img=>img.complete&&img.naturalWidth>0);
                },null,{timeout:15000});
                const measurements=await page.evaluate(()=>{
                  const cards=[...document.querySelectorAll('.jc-football-card')];
                  const vis=e=>e && getComputedStyle(e).display!=='none' && e.getBoundingClientRect().height>0;
                  const first=cards[0],second=cards[1];
                  const rows=x=>[...x.querySelectorAll('.jc-card-hit-chip')];
                  const logo=[...first.querySelectorAll('img.jc-team-logo')];
                  const hitCount=x=>x.querySelectorAll('.jc-card-hit-chip').length;
                  const priced=[...document.querySelectorAll('.jc-card-hit-chip em')];
                  return {
                    cardCount:cards.length,
                    minColumns:Math.round(first.getBoundingClientRect().width),
                    firstHeight:Math.round(first.getBoundingClientRect().height),
                    secondHeight:Math.round(second.getBoundingClientRect().height),
                    firstHitCount:hitCount(first),secondHitCount:hitCount(second),
                    firstPrice:priced[0]?.textContent?.trim(),
                    firstPricePrefix:priced[0]?getComputedStyle(priced[0],'::before').content:null,
                    priceCount:priced.length,
                    missingPrices:priced.filter(el=>!el.textContent?.trim()).length,
                    oddsVisible:vis(first.querySelector('.jc-mini-odds')),
                    reportVisible:vis(first.querySelector('.qc-mobile-report-link')),
                    linkText:first.querySelector('.qc-mobile-report-link')?.textContent?.trim(),
                    logoCount:logo.length,
                    logoState:logo.map(img=>({src:img.getAttribute('src'),complete:img.complete,naturalWidth:img.naturalWidth,cssDisplay:getComputedStyle(img).display})),
                    logoCatalogLoaded:Boolean(window.QC_TEAM_LOGO_CATALOG?.by_team),
                    cardHitTitleBg:getComputedStyle(first.querySelector('.jc-card-hit-title')).backgroundColor,
                    cardHitTitleShadow:getComputedStyle(first.querySelector('.jc-card-hit-title')).boxShadow,
                    reportColor:getComputedStyle(first.querySelector('.qc-mobile-report-link')).color,
                    teamColor:getComputedStyle(first.querySelector('.jc-team-name')).color,
                    chipTopPositions:[...new Set(rows(second).map(x=>Math.round(x.getBoundingClientRect().top)))].length,
                    chipClipped:rows(second).filter(x=>x.scrollWidth>x.clientWidth+2).length,
                    cardOverflow:cards.filter(x=>x.scrollWidth>x.clientWidth+3).length,
                    desktopOriginalCta:vis(first.querySelector('.jc-card-detail-btn')),
                    dateToolbarFilterText:document.querySelector('#jcFootballLeagueToggle')?.textContent||''
                  };
                });
                console.log('QCDA_CREST_DIAG '+item.name+' '+JSON.stringify(measurements));
                if(item.name!=='desktop'){
                  if(measurements.cardHitTitleBg!=='rgba(0, 0, 0, 0)' ||
                     measurements.cardHitTitleShadow!=='none' ||
                     measurements.reportColor!=='rgb(71, 143, 229)' ||
                     measurements.teamColor!=='rgb(31, 42, 68)')
                    throw Error(item.name+' preview color mismatch '+JSON.stringify(measurements));
                  if(measurements.logoState.some(img=>!img.complete||img.naturalWidth<=0))
                    throw Error(item.name+' Oct18 team crests not loaded '+JSON.stringify(measurements.logoState));
                }
                if(errors.length)throw Error(item.name+' JS '+errors.join(' | '));
                if(measurements.cardCount!==25 || measurements.missingPrices || measurements.logoCount<2)
                  throw Error(item.name+' missing match data '+JSON.stringify(measurements));
                const mobile=item.name!=='desktop';
                if(mobile){
                  if(measurements.oddsVisible || !measurements.reportVisible ||
                    !measurements.linkText.includes('玩法分析报告') ||
                    measurements.firstHitCount!==4 || measurements.secondHitCount!==5 ||
                    measurements.chipTopPositions!==2 ||
                    Math.abs(measurements.firstHeight-measurements.secondHeight)>3 ||
                    measurements.chipClipped || measurements.cardOverflow ||
                    measurements.firstPricePrefix!=='"@"')
                    throw Error(item.name+' compact layout failed '+JSON.stringify(measurements));
                  await page.locator('#jcFootballLeagueToggle').click();
                  const menuAudit=await page.evaluate(()=>{
                    const panel=document.querySelector('#jcFootballLeaguePopover');
                    const menu=document.querySelector('#jcFootballLeagueMenu');
                    const buttons=[...menu.querySelectorAll('button[data-league]')];
                    return {
                      toggle:document.querySelector('#jcFootballLeagueToggle')?.textContent.trim(),
                      title:panel.querySelector('.qc-football-mobile-title')?.textContent.trim(),
                      statusCount:menu.querySelectorAll('[data-status]').length,
                      statusLabel:menu.textContent.includes('比赛状态'),
                      allCount:buttons.length,
                      width:Math.round(panel.getBoundingClientRect().width),
                      firstRowHeight:Math.round(buttons[0]?.getBoundingClientRect().height||0),
                      panelOverflow:panel.scrollWidth>panel.clientWidth+2
                    };
                  });
                  console.log('QCDA_MOBILE_LEAGUE_MENU '+item.name+' '+JSON.stringify(menuAudit));
                  if(menuAudit.toggle!=='赛事'||menuAudit.title!=='赛事'||
                     menuAudit.statusCount!==0||menuAudit.statusLabel||
                     menuAudit.allCount<2||menuAudit.width>260||
                     menuAudit.firstRowHeight>44||menuAudit.panelOverflow)
                    throw Error(item.name+' mobile league menu not compact '+JSON.stringify(menuAudit));
                  const leagueButton=page.locator('#jcFootballLeagueMenu button[data-league]').nth(1);
                  const expectedCount=Number(await leagueButton.locator('b').textContent());
                  await leagueButton.click();
                  await page.waitForFunction(n=>document.querySelectorAll('.jc-football-card').length===n,expectedCount,{timeout:12000});
                  await page.locator('#jcFootballLeagueToggle').click();
                  await page.locator('#jcFootballLeagueMenu button[data-league="全部"]').click();
                  await page.waitForFunction(()=>document.querySelectorAll('.jc-football-card').length===25,null,{timeout:12000});
                  await page.locator('#jcFootballDateLabel').click();
                  if(!await page.locator('#jcDatePopover .qc-football-calendar-today').isVisible())
                    throw Error('Missing return-to-today calendar action on '+item.name);
                }else if(!measurements.oddsVisible || measurements.reportVisible){
                  throw Error('Desktop odds/cards changed '+JSON.stringify(measurements));
                }
                if(item.name!=='desktop'){
                  await page.goto(BASE+'2026-10-19',{waitUntil:'domcontentloaded',timeout:50000});
                  await page.waitForFunction(()=>document.querySelectorAll('.jc-football-card').length===8,null,{timeout:35000});
                  await page.waitForFunction(()=>{
                    const imgs=[...document.querySelectorAll('.jc-football-card')].slice(0,4).flatMap(card=>[...card.querySelectorAll('img.jc-team-logo')]);
                    return imgs.length===8 && imgs.every(img=>img.complete&&img.naturalWidth>0);
                  },null,{timeout:15000});
                  const todayLogos=await page.evaluate(()=>({
                    catalog:Boolean(window.QC_TEAM_LOGO_CATALOG?.by_team),
                    fixtures:[...document.querySelectorAll('.jc-football-card')].slice(0,4).map(card=>({
                      teams:[...card.querySelectorAll('.jc-team-name')].map(t=>t.textContent),
                      imgs:[...card.querySelectorAll('img.jc-team-logo')].map(i=>({src:i.getAttribute('src'),w:i.naturalWidth,complete:i.complete,display:getComputedStyle(i).display}))
                    }))
                  }));
                  console.log('QCDA_TODAY_CREST_DIAG '+item.name+' '+JSON.stringify(todayLogos));
                  if(!todayLogos.catalog || todayLogos.fixtures.some(x=>x.imgs.length!==2||x.imgs.some(img=>img.w<=0||!img.complete)))
                    throw Error(item.name+' Oct19 team crest missing '+JSON.stringify(todayLogos));
                  await page.screenshot({path:'/tmp/qc-prod-mobile/shots/'+item.name+'-20261019.png',fullPage:false});
                  // Audit frozen historical dates older than Oct18. Frozen
                  // archives must resolve the same immutable on-site crests.
                  for(const day of ['2026-10-17','2026-10-16','2026-10-10','2026-09-27']){
                    await page.goto(BASE+day,{waitUntil:'domcontentloaded',timeout:50000});
                    await page.waitForFunction(()=>document.querySelectorAll('.jc-football-card').length>0,null,{timeout:35000});
                    await page.waitForFunction(()=>{
                      const first=document.querySelector('.jc-football-card');
                      const icons=[...first?.querySelectorAll('img.jc-team-logo')||[]];
                      return icons.length===2 && icons.every(img=>img.complete&&img.naturalWidth>0);
                    },null,{timeout:18000});
                    const historic=await page.evaluate(()=>{
                      const cards=[...document.querySelectorAll('.jc-football-card')];
                      const imgs=[...document.querySelectorAll('.jc-football-card img.jc-team-logo')];
                      return {count:cards.length,catalogCount:Object.keys(window.QC_TEAM_LOGO_CATALOG?.by_team||{}).length,
                        imgCount:imgs.length,firstTeams:[...cards[0].querySelectorAll('.jc-team-name')].map(x=>x.textContent),
                        firstImgs:[...cards[0].querySelectorAll('img.jc-team-logo')].map(x=>({src:x.getAttribute('src'),naturalWidth:x.naturalWidth,loaded:x.complete})),
                        firstCard:cards[0].textContent.slice(0,110),
                        rowsWithImage:[...cards].filter(c=>c.querySelectorAll('img.jc-team-logo').length===2).length};
                    });
                    console.log('QCDA_HISTORIC_LOGO_DIAG '+item.name+' '+day+' '+JSON.stringify(historic));
                    if(historic.firstImgs.length!==2 ||
                      historic.firstImgs.some(img=>img.naturalWidth===0||!img.loaded||!img.src.startsWith('assets/team-logos/'))||
                      historic.rowsWithImage!==historic.count)
                      throw Error(item.name+' historical frozen crests not truly static '+day+' '+JSON.stringify(historic));
                    await page.screenshot({path:'/tmp/qc-prod-mobile/shots/'+item.name+'-'+day+'.png',fullPage:false});
                  }
                }
                await page.screenshot({path:'/tmp/qc-prod-mobile/shots/'+item.name+'.png',fullPage:false});
                console.log('QCDA_MOBILE_COMPACT_PASS '+item.name+' '+JSON.stringify(measurements));
                // Regression: restored detail-page 赔率变化 must list earlier
                // immutable public pre-kickoff captures, not just latest rows.
                // 2026-10-18 周日018 has 14 HAD snapshots in the real database.
                if(item.name!=='desktop'){
                  const detail=await page.goto('https://qcda.cn/jc-match.html?id=2d1dcabd-2a9a-40f3-9f56-5b5f37472f8f',
                    {waitUntil:'domcontentloaded',timeout:50000});
                  if(detail.status()!==200)throw Error(item.name+' detail HTTP '+detail.status());
                  await page.locator('.jc-main-tabs button[data-main-tab="odds"]').waitFor({timeout:30000});
                  await page.locator('.jc-main-tabs button[data-main-tab="odds"]').click();
                  await page.waitForFunction(()=>{
                    return document.querySelectorAll('.jc-history-row').length>=10;
                  },null,{timeout:25000});
                  const history=await page.evaluate(()=>({
                    count:document.querySelectorAll('.jc-history-row').length,
                    uniqueTimes:new Set([...document.querySelectorAll('.jc-history-row')].map(x=>x.querySelector('span')?.textContent)).size,
                    title:document.querySelector('.jc-odds-section h2')?.textContent||'',
                    cells:[...document.querySelectorAll('.jc-history-row')].slice(0,2).map(x=>x.textContent)
                  }));
                  if(history.count!==12 || history.uniqueTimes<2)
                    throw Error(item.name+' odds history still truncated '+JSON.stringify(history));
                  console.log('QCDA_ODDS_HISTORY_RESTORED '+item.name+' '+JSON.stringify(history));
                  await page.screenshot({path:'/tmp/qc-prod-mobile/shots/'+item.name+'-odds-history.png',fullPage:false});
                }
                await ctx.close();
              } finally{await browser.close()}
            }
          })().catch(e=>{console.error(e.stack||String(e));process.exitCode=1});
          JS
      - name: Keep browser screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-mobile-compact-production-screenshots
          path: /tmp/qc-prod-mobile/shots/
          if-no-files-found: warn
          retention-days: 7
