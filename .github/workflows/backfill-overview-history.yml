name: Backfill Overview History

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/backfill-overview-history.yml"
      - "scripts/backfill-overview-history.mjs"

permissions:
  contents: write

concurrency:
  group: backfill-overview-history
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Build frozen history snapshots
        env:
          START_DATE: "2026-09-26"
          END_DATE: "2026-10-04"
        run: node scripts/backfill-overview-history.mjs

      - name: Commit frozen history snapshots
        if: always()
        run: |
          git config user.name "qiuchang-history-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/overview/
          if git diff --cached --quiet; then
            echo "No history backfill changes"
          else
            git commit -m "Backfill legacy overview history"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
