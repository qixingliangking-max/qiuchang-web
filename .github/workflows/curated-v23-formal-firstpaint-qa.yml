name: Curated V2.3 formal first-paint QA
on:
  pull_request:
    paths:
      - 'internal-test/curated-lab-20261019.html'
      - 'internal-test/curated-lab-20261019.js'
      - 'internal-test/curated-db-direct-20261022.js'
      - 'scripts/curated_v23_formal_firstpaint_qa_20261030.cjs'
      - '.github/workflows/curated-v23-formal-firstpaint-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse curated JavaScript
        run: |
          node --check internal-test/curated-lab-20261019.js
          node --check internal-test/curated-db-direct-20261022.js
      - name: Assert V2.3 formal display and single first paint
        run: node --test scripts/curated_v23_formal_firstpaint_qa_20261030.cjs
