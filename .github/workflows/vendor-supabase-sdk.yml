# One-shot vendoring of the official Supabase browser SDK.
# Run once on creation; keep the pinned artifact in the repository afterwards.
name: Vendor Supabase browser SDK
on:
  push:
    paths:
      - '.github/workflows/vendor-supabase-sdk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch pinned official UMD bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/vendor
          url='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js'
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 100 "$url" -o assets/vendor/supabase-js-2.117.3.js
          test "$(wc -c < assets/vendor/supabase-js-2.117.3.js)" -gt 100000
          grep -q 'supabase' assets/vendor/supabase-js-2.117.3.js
          printf 'Original: %s\nVersion: @supabase/supabase-js 2.117.3\nLicense: MIT (Supabase)\n' "$url" > assets/vendor/README.txt
      - name: Commit immutable browser bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/vendor/supabase-js-2.117.3.js assets/vendor/README.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'vendor: self-host pinned Supabase JS 2.117.3'
          git push
