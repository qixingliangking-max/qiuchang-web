name: Sporttery network probe
on:
  push:
    paths:
      - '.github/workflows/sporttery-probe.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Browser-like Sporttery probe
        shell: bash
        run: |
          set +e
          python -m pip install -q selenium
          cat > /tmp/probe.py <<'PY'
          import json, time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          opts = Options()
          opts.add_argument("--headless=new")
          opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-dev-shm-usage")
          opts.add_argument("--window-size=1280,900")
          opts.add_argument("--lang=zh-CN")
          opts.add_argument("--user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/132.0.0.0 Safari/537.36")

          out = {"page": {}, "api": {}}
          driver = webdriver.Chrome(options=opts)
          try:
              page = "https://m.sporttery.cn/mjc/jsq/zqspf/"
              driver.get(page)
              time.sleep(5)
              out["page"] = {
                  "url": driver.current_url,
                  "title": driver.title,
                  "source_prefix": driver.page_source[:300]
              }
              script = r'''
              const done = arguments[0];
              fetch('https://webapi.sporttery.cn/gateway/uniform/football/getMatchCalculatorV1.qry?channel=c&poolCode=had,hhad,crs,ttg,hafu', {
                method:'GET',
                credentials:'include',
                headers:{'Accept':'application/json, text/javascript, */*; q=0.01','X-Requested-With':'XMLHttpRequest'}
              }).then(async r => {
                const t = await r.text();
                done({ok:r.ok,status:r.status,type:r.headers.get('content-type'),prefix:t.slice(0,300),length:t.length});
              }).catch(e => done({error:String(e)}));
              '''
              driver.set_script_timeout(30)
              out["api"] = driver.execute_async_script(script)
          except Exception as e:
              out["error"] = repr(e)
          finally:
              driver.quit()

          with open("sporttery-probe-result.txt","w",encoding="utf-8") as f:
              f.write(json.dumps(out, ensure_ascii=False, indent=2))
          print(json.dumps(out, ensure_ascii=False, indent=2))
          PY
          python /tmp/probe.py
      - name: Commit probe result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sporttery-probe-result.txt
          git commit -m 'Record browser Sporttery probe result' || exit 0
          git push
