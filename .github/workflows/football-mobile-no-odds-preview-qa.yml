name: Mobile football no-odds preview smoke
on:
  workflow_dispatch:
  push:
    paths:
      - 'internal-test/football-mobile-no-odds-20261019.html'
      - '.github/workflows/football-mobile-no-odds-preview-qa.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser runners
        run: |
          mkdir -p /tmp/qc-mobile-odds-qa
          cd /tmp/qc-mobile-odds-qa
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Check published preview in both mobile engines
        env:
          NODE_PATH: /tmp/qc-mobile-odds-qa/node_modules
        run: |
          node <<'JS'
          const {chromium,webkit,devices}=require('playwright');
          const fs=require('fs');
          (async()=>{
            const engines=[
              {name:'android',type:chromium,device:devices['Pixel 7']},
              {name:'iphone',type:webkit,device:devices['iPhone 13']}
            ];
            fs.mkdirSync('preview-screenshots',{recursive:true});
            for(const e of engines){
              const browser=await e.type.launch({headless:true});
              try{
                const ctx=await browser.newContext({...e.device,locale:'zh-CN'});
                const page=await ctx.newPage();
                const exceptions=[];
                page.on('pageerror',error=>exceptions.push(String(error)));
                const url='https://qcda.cn/internal-test/football-mobile-no-odds-20261019.html';
                const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});
                if(response.status()!==200)throw Error(e.name+' preview HTTP '+response.status());
                await page.waitForFunction(()=>document.querySelectorAll('.qc-demo-card').length===8,null,{timeout:30000});
                if(await page.locator('.jc-mini-odds, .jc-mini-row').count())throw Error('Odds still rendered in preview cards');
                const publicView=await page.evaluate(()=>{
                  const pending=document.querySelector('.qc-demo-result.pending');
                  const status=pending?.nextElementSibling;
                  return {
                    privateCopy:/紧凑列表测试|正式页面|命中赔率保留|未公开的Pro预测|仅展示已公开/.test(document.body.innerText),
                    pendingColor:pending?getComputedStyle(pending).color:'',
                    pendingStatusColor:status?getComputedStyle(status).color:'',
                    awaitingText:status?.textContent?.trim(),
                    summary:document.querySelector('#qcSummary')?.textContent||'',
                    title:document.title
                  };
                });
                if(publicView.privateCopy || publicView.pendingColor!=='rgb(71, 143, 229)' ||
                   publicView.pendingStatusColor!=='rgb(120, 168, 229)' ||
                   publicView.awaitingText!=='未开赛' ||
                   publicView.title!=='球场档案｜竞彩足球' ||
                   !/8场比赛.*0场完赛/.test(publicView.summary))
                  throw Error(e.name+' copy / pending palette invalid '+JSON.stringify(publicView));
                console.log('PASS '+e.name+' no internal wording, clear blue VS / 未开赛 '+JSON.stringify(publicView));
                // Interactive right-hand 赛事筛选 must actually filter the
                // public static roster; date selector owns 回到今天.
                if(await page.locator('#qcToday').count())
                  throw Error('Obsolete 19号 date shortcut remains');
                await page.locator('#qcFilter').click();
                await page.locator('#qcStatusChoices [data-status="finished"]').click();
                if(await page.locator('.qc-demo-card').count())
                  throw Error('No finished fixtures expected in 19th static roster');
                await page.locator('#qcStatusChoices [data-status="pending"]').click();
                if(await page.locator('.qc-demo-card').count()!==8)
                  throw Error('Pending status filter failed to restore 8 fixtures');
                const league=await page.locator('#qcLeagueChoices [data-league]:not([data-league="全部"])').first().getAttribute('data-league');
                await page.locator('#qcLeagueChoices [data-league="'+league+'"]').click();
                const filtered=await page.locator('.qc-demo-card').count();
                if(filtered<1 || filtered>=8 || !(await page.locator('#qcFilter').getAttribute('class')).includes('active'))
                  throw Error('League filter failed '+JSON.stringify({league,filtered}));
                await page.locator('#qcResetFilter').click();
                if(await page.locator('.qc-demo-card').count()!==8)
                  throw Error('Reset filter failed to restore 8 fixtures');
                await page.locator('#qcDate').click();
                if(!await page.locator('#qcDatePanel').isVisible() ||
                   !await page.locator('#qcBackToToday').isVisible() ||
                   !await page.locator('#qcFilterPanel').isHidden())
                  throw Error('Date picker or 回到今天 missing');
                await page.locator('#qcDateChoices [data-date="2026-10-18"]').click();
                await page.waitForFunction(()=>document.querySelectorAll('.qc-demo-card').length===25,null,{timeout:30000});
                await page.locator('#qcDate').click();
                const bjt=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
                if(bjt==='2026-10-19'){
                  await page.locator('#qcBackToToday').click();
                  await page.waitForFunction(()=>document.querySelectorAll('.qc-demo-card').length===8,null,{timeout:30000});
                } else {
                  if(await page.locator('#qcBackToToday').isEnabled() && !await page.locator('#qcDateChoices [data-date="'+bjt+'"]').count())
                    throw Error('Return to today should be disabled for unpublished test date');
                  await page.locator('#qcDateChoices [data-date="2026-10-19"]').click();
                  await page.waitForFunction(()=>document.querySelectorAll('.qc-demo-card').length===8,null,{timeout:30000});
                }
                await page.screenshot({path:'preview-screenshots/'+e.name+'-20261019.png',fullPage:false});
                await page.locator('#qcPrev').click();
                await page.waitForFunction(()=>document.querySelectorAll('.qc-demo-card').length===25,null,{timeout:30000});
                const d=await page.evaluate(()=>{
                  const cards=[...document.querySelectorAll('.qc-demo-card')];
                  const complete=cards.filter(x=>/半\s*\d+[-:]\d+/.test(x.innerText)).length;
                  const first=cards[0];
                  return {rows:cards.length,complete,hits:cards.filter(x=>x.querySelector('.qc-demo-chip')).length,
                    linked:cards.filter(x=>x.querySelector('a[href^="../jc-match.html?id="]')).length,
                    odds:document.querySelectorAll('.jc-mini-odds').length,
                    priceTags:document.querySelectorAll('.qc-demo-chip-odd').length,
                    missingHitPrice:[...document.querySelectorAll('.qc-demo-chip')].filter(x=>!x.querySelector('.qc-demo-chip-odd')?.textContent?.includes('@')).length,
                    firstChips:[...first.querySelectorAll('.qc-demo-chip')].map(x=>x.textContent.trim()),
                    firstHeight:Math.round(first.getBoundingClientRect().height),
                    secondHeight:Math.round(cards[1].getBoundingClientRect().height),
                    firstChipsCount:first.querySelectorAll('.qc-demo-chip').length,
                    secondChipsCount:cards[1].querySelectorAll('.qc-demo-chip').length,
                    ctaInTitle:Boolean(first.querySelector('.qc-demo-hits-head .qc-demo-cta')),
                    unifiedLabels:cards.every(x=>x.querySelector('.qc-demo-cta')?.textContent?.includes('玩法分析报告')),
                    ctaSingleLine:cards.every(x=>x.querySelector('.qc-demo-cta')?.getClientRects().length===1),
                    titleSingleLine:cards.every(x=>{
                      const h=x.querySelector('.qc-demo-hits-head');
                      const t=h?.querySelector('.qc-demo-hit-title'),a=h?.querySelector('.qc-demo-cta');
                      return !h || !t || !a || Math.abs(t.getBoundingClientRect().top-a.getBoundingClientRect().top)<7;
                    }),
                    duplicateBottomCta:Boolean(first.querySelector('.qc-demo-all > .qc-demo-cta')),
                    chipRows:[...new Set([...cards[1].querySelectorAll('.qc-demo-chip')].map(x=>Math.round(x.getBoundingClientRect().top)))].length,
                    clipped:[...document.querySelectorAll('.qc-demo-chip')].filter(x=>x.scrollWidth>x.clientWidth+2).length,
                    widthOverflows:cards.filter(x=>x.scrollWidth>x.clientWidth+3).length,
                    forbiddenTerms:/正常推理|高赔率|(^|[\\s｜])中赔率([\\s｜]|$)/.test(document.body.innerText)};
                });
                if(d.rows!==25 || d.complete<21 || d.hits<20 || d.odds!==0 || d.linked!==25 ||
                   !d.priceTags || d.missingHitPrice || d.forbiddenTerms ||
                   !d.ctaInTitle || !d.unifiedLabels || !d.ctaSingleLine || !d.titleSingleLine ||
                   d.duplicateBottomCta || d.chipRows!==2 ||
                   d.firstChipsCount!==4 || d.secondChipsCount!==5 ||
                   d.firstHeight>205 || Math.abs(d.firstHeight-d.secondHeight)>2 ||
                   d.clipped || d.widthOverflows ||
                   !d.firstChips.some(x=>x.includes('1.67')) || !d.firstChips.some(x=>x.includes('3.35')))
                  throw Error(e.name+' invalid 18th display '+JSON.stringify(d));
                if(exceptions.length)throw Error(e.name+' exceptions '+exceptions.join('|'));
                await page.screenshot({path:'preview-screenshots/'+e.name+'-20261018.png',fullPage:false});
                console.log('PASS '+e.name+' compact dates, local logos, zero odds tables, public FT hit price pills '+JSON.stringify(d));
                await ctx.close();
              }finally{await browser.close()}
            }
          })().catch(error=>{console.error(error.stack||String(error));process.exitCode=1});
          JS
      - name: Upload mobile preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-football-no-odds-preview
          path: preview-screenshots/
          if-no-files-found: warn
          retention-days: 7
