name: Publish confirmed final scores into static fixture file

on:
  workflow_dispatch:
  # The history publisher runs independently and frequently; its completion
  # gives score publication a second trigger when GitHub delays cron events.
  workflow_run:
    workflows: ["Publish finalized public football history"]
    types: [completed]
    branches: [main]
  schedule:
    # Silent checks. Git commits/deployments happen ONLY for newly confirmed FT.
    # GH scheduled jobs are best effort and may start a few minutes late.
    - cron: '4,14,24,34,44,54 * * * *'
  push:
    paths:
      - 'scripts/publish_final_scores.py'
      - 'scripts/prerender_public_football.cjs'
      - 'scripts/football_prerender_qa_20261029.cjs'
      - '.github/workflows/publish-finished-scores.yml'

permissions:
  contents: write

concurrency:
  # Shares the crest/schedule writer lock: never race on live manifest/files.
  group: qcda-immutable-team-crests
  cancel-in-progress: false

jobs:
  publish-confirmed-final:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      has_new_finals: ${{ steps.publish.outputs.has_new_finals }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout published public data
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert final-only update invariants
        run: python3 scripts/publish_final_scores.py --self-test

      - name: Copy newly confirmed FT into static fixture without changing other fields
        run: python3 scripts/publish_final_scores.py

      - name: Re-render public football HTML after confirmed FT scores
        run: |
          node scripts/prerender_public_football.cjs
          node --test scripts/football_prerender_qa_20261029.cjs

      - name: Publish versioned final snapshot only if any match newly finished
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git add data/overview/live/ data/overview/live-schedule-manifest.json football.html
          if git diff --cached --quiet; then
            echo 'has_new_finals=false' >> "$GITHUB_OUTPUT"
            echo 'No new official finals. No file change or deployment.'
            exit 0
          fi
          echo 'has_new_finals=true' >> "$GITHUB_OUTPUT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data(scores): freeze newly confirmed finished fixtures'
          git pull --rebase origin main
          git push origin HEAD:main

  refresh-p3-after-new-finals:
    name: Refresh P3 after new confirmed final scores
    needs: publish-confirmed-final
    if: needs.publish-confirmed-final.outputs.has_new_finals == 'true'
    uses: ./.github/workflows/p3-refresh-scheduled.yml
    permissions:
      contents: write
