name: Curated History Market Tab Sync QA
on:
  push:
    branches: [qcda-history-filter-tabs-20261023]
    paths:
      - .github/workflows/curated-history-tab-sync-qa-20261023.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qcda-history-filter-tabs-20261023
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check changed source syntax
        run: node --check internal-test/curated-lab-20261019.js
      - name: Browser dependencies
        run: |
          mkdir -p /tmp/qc-curated-check
          cd /tmp/qc-curated-check
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify original UI, real history interactions, three-person placeholders
        env:
          NODE_PATH: /tmp/qc-curated-check/node_modules
        run: |
          node - <<'NODE'
          const {chromium}=require('playwright'),fs=require('fs'),assert=require('node:assert/strict');
          const html=fs.readFileSync('internal-test/curated-lab-20261019.html','utf8')
            .replace(/<script\b[^>]*src="[^"]+"[^>]*><\/script>/g,'');
          assert(html.includes('id="historyRows"')&&!html.includes('14天遮挡回测'));
          const markets=['direction','htft','goals','score'];
          function options(project){
            return project==='direction'?[{label:'胜',odd:2.38}]:
            project==='htft'?[{label:'负/负',odd:4.2}]:
            project==='goals'?[{label:'2球',odd:3.2},{label:'3球',odd:3.5}]:
            [{label:'2-1',odd:8.4},{label:'2-0',odd:9.6},{label:'3-1',odd:11.5}];
          }
          function legs(project,addon){
            const size=project==='score'&&addon?3:2,kind={direction:'had',htft:'hafu',goals:'ttg',score:'crs'}[project];
            return Array.from({length:size},(_,i)=>({
              match_num:'周三00'+(i+1),home:'历史主队'+i,away:'历史客队'+i,
              market_kind:kind,market:kind,options:options(project),
              selections:options(project).map(x=>x.label),ft:'2-1',ht:'1-0',
              odds_captured_at:'2026-10-21T05:00:00Z'
            }));
          }
          const main=['baseline','ai_analyst'].flatMap(track=>markets.map(project=>({
            track,project,settlement_status:'settled',group_hit:true,legs:legs(project,false)
          })));
          const extra=markets.map(project=>({
            project,settlement_status:'settled',group_hit:false,
            legs:legs(project,true),
            leg_results:legs(project,true).map(l=>({match_num:l.match_num,ft:'2-1',ht:'1-0'}))
          }));
          (async()=>{
            const browser=await chromium.launch();
            try{
              for(const device of [{name:'desktop',width:1280,height:900},{name:'mobile',width:390,height:844}]){
                const p=await browser.newPage({viewport:{width:device.width,height:device.height}});
                const errors=[];p.on('pageerror',e=>errors.push(String(e)));
                await p.clock.install({time:new Date('2026-10-22T12:00:00Z')});
                await p.setContent(html);
                await p.evaluate(({main,extra})=>{
                  window.QC_SUPABASE_URL='https://example.supabase.co';
                  window.QC_SUPABASE_PUBLISHABLE_KEY='stub';
                  window.fetch=async function(url,opts){
                    const arg=JSON.parse(opts.body||'{}'),day=arg.p_date||arg.p_business_date;
                    const isMain=String(url).includes('qc_selection_display_public');
                    const groups=isMain?(day==='2026-10-21'?main:[]):(['2026-10-21','2026-10-22'].includes(day)?extra:[]);
                    const data=isMain?{date:day,batch_status:day==='2026-10-21'?'candidate':'missing',groups}:
                        {date:day,groups};
                    return {ok:true,status:200,json:async()=>data};
                  };
                },{main,extra});
                await p.addScriptTag({path:'internal-test/curated-lab-data-20261019.js'});
                await p.addScriptTag({path:'internal-test/curated-db-direct-20261022.js'});
                await p.addScriptTag({path:'internal-test/curated-lab-20261019.js'});
                await p.waitForFunction(()=>document.querySelectorAll('#historyRows .hist-row').length>=3,{timeout:12000});
                assert.equal(await p.locator('#plans .plan').count(),3,'three daily positions');
                assert.equal(await p.locator('#plans [data-qc-missing-main]').count(),2,'do not fabricate 10/22 main data');
                assert.equal(await p.locator('#plans .inspect').count(),1,'today actual analyst detail');
                const labels=await p.locator('#plans .plan-id').allInnerTexts();
                assert.deepEqual(labels,['顾衡','沈策','陆野']);
                assert.equal(await p.locator('#historyRows [data-open-date="2026-10-21"]').count(),3);
                assert.equal(await p.locator('#historyRows .hist-row:not([data-open-type="direction"])').count(),0);
                assert.equal(await p.locator('#historyRows [data-open-date="2026-10-22"]').count(),0);
                assert((await p.locator('#historyRows').innerText()).includes('赛后补核'));
                await p.locator('#historyRows [data-open-date="2026-10-21"][data-open-type="direction"][data-open-index="1"]').click();
                assert.equal(await p.locator('#overlay').getAttribute('hidden'),null);
                assert((await p.locator('#dialogBody').innerText()).includes('组合分配'));
                await p.locator('#modeTabs [data-mode="hot"]').click();
                await p.locator('#modeTabs [data-mode="cold"]').click();
                await p.locator('#modeTabs [data-mode="hybrid"]').click();
                await p.locator('#modeTabs [data-mode="balanced"]').click();
                await p.locator('#closeDialog').click();
                for(const [type,title] of [['htft','半全场'],['goals','总进球'],['score','比分'],['direction','胜平负']]){
                  await p.locator('#tabs button[data-type="'+type+'"]').click();
                  assert((await p.locator('#historyRows .hist-row').count())>=3,type+' needs at least the submitted three records');
                  assert.equal(await p.locator('#historyRows [data-open-date="2026-10-21"]').count(),3,type+' must preserve three 10/21 plans');
                  assert.equal(await p.locator('#historyRows .hist-row:not([data-open-type="'+type+'"])').count(),0,type+' cross-category');
                  assert((await p.locator('#historyHeading h2').innerText()).includes(title),'title should reflect selected tab');
                }
                await p.locator('#tabs button[data-type="score"]').click();
                await p.locator('#historyRows [data-open-date="2026-10-21"][data-open-type="score"][data-open-index="3"]').click();
                assert.equal(await p.locator('#dialogBody tbody tr').count(),27,'three-score combo count');
                await p.locator('#closeDialog').click();
                await p.locator('#budget').fill('1000');
                assert((await p.locator('#historyRows [data-open-date="2026-10-21"]').first().innerText()).length>0);
                if(errors.length)throw Error('page errors '+errors.join(';'));
                console.log('PASS',device.name,{todaySlots:3,missingMain:2,historyActiveMarket:3,scoreCombinations:27,errors});
                await p.close();
              }
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
