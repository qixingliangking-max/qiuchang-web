name: Publish finalized public football history

on:
  schedule:
    # Beijing 10:20 / 13:30 / 20:30: new archived day, then FT catch-ups.
    - cron: '20 2 * * *'
    - cron: '30 5 * * *'
    - cron: '30 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-public-football-history
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'qixingliangking-max/qiuchang-web'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout published website
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish public history snapshots only
        run: python scripts/publish_public_overview_archives.py
      - name: Commit only static archive assets and manifest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/overview/manifest.json data/overview/*.history.v*.json
          if git diff --cached --quiet; then
            echo "No new public finalized history to publish"
            exit 0
          fi
          git commit -m "archive(history): publish daily public fixed snapshots"
          git push
