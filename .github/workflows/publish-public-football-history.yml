name: Publish finalized public football history

on:
  schedule:
    # Latest confirmed FT/HT: every 10 minutes, near the score publisher.
    # GitHub schedule is best effort; deploys happen ONLY when rows change.
    - cron: '6,16,26,36,46,56 * * * *'
    # Beijing 10:20: daily full 35-day catch-up for late official recoveries.
    - cron: '20 2 * * *'
  workflow_dispatch:
  # Editing this guarded workflow or exporter also launches an immediate
  # catch-up run when a scheduled GitHub Actions execution is delayed.
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-public-football-history.yml'
      - 'scripts/publish_public_overview_archives.py'

permissions:
  contents: write

concurrency:
  group: publish-public-football-history
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'qixingliangking-max/qiuchang-web'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout published website
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish public history snapshots only
        env:
          # High-frequency runs scan only the last three business days.
          # Push/manual and daily catch-up scan the full 35-day horizon.
          QC_ARCHIVE_RECENT_ONLY: ${{ github.event_name == 'schedule' && github.event.schedule != '20 2 * * *' && '1' || '0' }}
        run: python scripts/publish_public_overview_archives.py
      - name: Commit only static archive assets and manifest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/overview/manifest.json data/overview/*.history.v*.json
          if git diff --cached --quiet; then
            echo "No new public finalized history to publish"
            exit 0
          fi
          git commit -m "archive(history): publish daily public fixed snapshots"
          git pull --rebase origin main
          git push origin HEAD:main
