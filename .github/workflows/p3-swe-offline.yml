name: P3 SWE Offline Build

on:
  push:
    branches: [ main ]
    paths:
      - "scripts/p3-offline-builder-core.js"
      - "scripts/build-swe-p3-offline.js"
      - "internal-test/p3-candidates/raw/SWE_AS-2026-batch*.json"
      - "internal-test/p3-data/P3_SCHEMA_CONTRACT_V5.json"
      - ".github/workflows/p3-swe-offline.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Syntax check
        run: |
          node --check scripts/p3-offline-builder-core.js
          node --check scripts/build-swe-p3-offline.js

      - name: Build candidate and gate
        id: build
        continue-on-error: true
        run: node scripts/build-swe-p3-offline.js

      - name: Commit generated candidate and gate
        run: |
          git config user.name "qiuchang-p3-bot"
          git config user.email "actions@users.noreply.github.com"
          git add internal-test/p3-candidates/SWE_AS-2026.json
          git add internal-test/p3-candidates/SWE_AS-2026-gate.json
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Build SWE AS P3 candidate and gate"
            git push
          fi

      - name: Enforce gate
        run: |
          node -e 'const r=require("./internal-test/p3-candidates/SWE_AS-2026-gate.json"); console.log(r); if(r.gate_status!=="PASS") process.exit(1)'
