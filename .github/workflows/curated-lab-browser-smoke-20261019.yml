name: Curated research lab offline browser test
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/curated-lab-browser-smoke-20261019.yml'
      - 'internal-test/curated-lab-20261019.html'
      - 'internal-test/curated-lab-20261019.js'
      - 'internal-test/curated-lab-data-20261019.js'
      - 'internal-test/curated-lab-blind-selection-20261005-18.js'
      - 'internal-test/curated-lab-blind-settlement-20261005-18.js'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright Chromium
        run: |
          mkdir -p /tmp/curated-test
          cd /tmp/curated-test
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate mobile and desktop interactions offline
        shell: bash
        run: |
          cat > /tmp/curated-test/check.cjs <<'JS'
          const {chromium,devices}=require('playwright');
          const fs=require('fs');
          const path=require('path');
          const url='file://'+path.resolve('internal-test/curated-lab-20261019.html');
          const report=[];
          async function check(browser,device,name){
            const context=await browser.newContext({...device,locale:'zh-CN',timezoneId:'Asia/Shanghai'});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto(url,{waitUntil:'load'});
            await page.waitForSelector('#plans .plan',{timeout:15000});
            if(await page.locator('#manualPlans').count())throw Error(name+': separate manual panel must be removed');
            const initialDay=await page.locator('#dateLabel').innerText();
            if(!initialDay.includes('10月19日'))throw Error(name+': selected day should open first '+initialDay);
            if(await page.locator('#plans .plan').count()!==2)throw Error(name+': expected two independently selected pairs');
            const intro=await page.locator('#plans .plan').first().innerText();
            for(const word of ['周一002','让胜（+1）','1.50','周一007','普通主胜','1.36','2.04','待赛']){
              if(!intro.includes(word))throw Error(name+': missing official selection '+word);
            }
            if(/人工录入|未命中|模拟返还/.test(intro))throw Error(name+': inappropriate text on pending pair');
            const labels=await page.locator('#plans .plan .plan-id').allInnerTexts();
            if(!labels[0].includes('原方案')||!labels[1].includes('AI精选师 V1'))throw Error(name+': dual version titles missing '+JSON.stringify(labels));
            const aiDirection=await page.locator('#plans .plan').nth(1).innerText();
            if(!aiDirection.includes('周一002')||!aiDirection.includes('周一007')||!aiDirection.includes('2.04'))throw Error(name+': shadow direction odds mismatch');
            const title=await page.locator('.hero h1').innerText();
            if(title!=='精选方案')throw Error(name+': wrong user-facing heading '+title);
            if((await page.locator('body').innerText()).includes('生产数据变更')||(await page.locator('body').innerText()).includes('INTERNAL PREVIEW'))throw Error(name+': leaked internal labels');
            if((await page.locator('#history .hist-row').count())<8)throw Error(name+': history missing');
            if(await page.locator('.method').evaluate(el=>el.open))throw Error(name+': method text not collapsed');
            const dayBefore=await page.locator('#dateLabel').innerText();
            if(!dayBefore.includes('10月19日'))throw Error(name+': default date incorrect: '+dayBefore);
            const firstPlan=await page.locator('#plans .plan').count();
            if(firstPlan!==2)throw Error(name+': selected day should have two versioned plans');
            await page.locator('#budget').fill('1000');
            if(!(await page.locator('#budget').inputValue()).includes('1000'))throw Error(name+': budget input incorrect');
            await page.locator('#plans .plan .inspect').first().click();
            await page.waitForTimeout(250);
            const modalState=await page.evaluate(()=>({hidden:document.getElementById('overlay').hidden,dialog:document.getElementById('dialogBody').innerText.slice(0,200),state:document.getElementById('overlay').outerHTML.slice(0,120)}));
            console.log('MODAL_DIAG '+JSON.stringify({name,modalState,errors}));
            if(modalState.hidden)throw Error(name+': modal did not open: '+JSON.stringify({modalState,errors}));
            await page.locator('#overlay:not([hidden]) .dialog').waitFor({timeout:4000});
            const modalRows=await page.locator('.alloc tbody tr').count();
            if(modalRows!==1)throw Error(name+': direction must have one priced branch');
            if(!(await page.locator('.alloc tbody').innerText()).includes('2.04'))throw Error(name+': direction combined odds missing');
            if(!(await page.locator('#dialogBody').innerText()).includes('待赛'))throw Error(name+': pending modal must not settle');
            const firstShare=await page.locator('.alloc tbody tr:first-child td:nth-child(4)').textContent();
            await page.locator('#modeTabs button[data-mode="cold"]').click();
            const secondShare=await page.locator('.alloc tbody tr:first-child td:nth-child(4)').textContent();
            if(modalRows>1&&firstShare===secondShare)throw Error(name+': strategy does not change stake');
            await page.screenshot({path:'/tmp/curated-test/'+name+'-modal.png',fullPage:true});
            await page.locator('#closeDialog').click();
            for(const [type,originalCount,shadowCount,originalOdds,shadowOdds,shadowTeams] of [
              ['htft',4,4,['1.92','4.00','2.05','3.80'],['2.05','3.80','2.20','3.80'],['周一007','周一008']],
              ['goals',9,4,['3.80','2.95','3.90','4.35','4.00','3.20'],['2.95','3.90','3.30','3.25'],['周一003','周一007']],
              ['score',9,9,['14.00','6.00','9.00','8.00','9.00','5.25'],['8.00','9.00','5.25','9.50','4.80','11.50'],['周一003','周一006']],
              ['direction',1,1,['1.50','1.36'],['1.50','1.36'],['周一002','周一007']]
            ]){
              await page.locator('#tabs button[data-type="'+type+'"]').click();
              if((await page.locator('#tabs button[data-type="'+type+'"]').getAttribute('aria-selected'))!=='true')throw Error(name+': tab not active');
              if(await page.locator('#plans .plan').count()!==2)throw Error(name+': selected plan count must be two for '+type);
              for(const [index,count,odds] of [[0,originalCount,originalOdds],[1,shadowCount,shadowOdds]]){
                const legText=await page.locator('#plans .plan').nth(index).innerText();
                for(const odd of odds)if(!legText.includes(odd))throw Error(name+': missing '+(index?'AI':'original')+' odds '+odd+' in '+type);
                if(index===1)for(const team of shadowTeams)if(!legText.includes(team))throw Error(name+': wrong shadow fixture in '+type+' '+team);
                await page.locator('#plans .plan').nth(index).locator('.inspect').click();
                if((await page.locator('#dialogSub').innerText()).includes(index?'原方案':'AI精选师'))throw Error(name+': variant dialog not separated');
                const n=await page.locator('.alloc tbody tr').count();
                if(n!==count)throw Error(name+': expected '+count+' combos in '+type+' variant '+index+', got '+n);
                if((await page.locator('#dialogBody').innerText()).includes('未命中'))throw Error(name+': unplayed version shows settlement');
                await page.locator('#closeDialog').click();
              }
            }
            await page.locator('#dateLabel').click();
            await page.locator('#calDays button[data-date="2026-10-17"]').click();
            const dayAfter=await page.locator('#dateLabel').innerText();
            if(!dayAfter.includes('10月17日'))throw Error(name+': calendar failed: '+dayAfter);
            if(await page.locator('#plans .plan').count()!==1)throw Error(name+': frozen blind day should show exactly one historic plan per category');
            if(!(await page.locator('#plans').innerText()).includes('赛果遮挡'))throw Error(name+': blind result label missing');
            if(await page.locator('#history .hist-row').count()!==14)throw Error(name+': 14-day frozen history count incorrect');
            if(!(await page.locator('#revealRow').isVisible()))throw Error(name+': reveal control missing');
            const histBefore=await page.locator('#history').innerText();
            if(!histBefore.includes('遮挡')||histBefore.includes('未命中'))throw Error(name+': result leaked before reveal '+JSON.stringify({hist:histBefore.slice(0,1500),reveal:await page.locator('#revealBlind').innerText()}));
            if(!(await page.locator('#compareSection').isVisible()))throw Error(name+': combo comparison missing');
            if((await page.locator('#compareBody').innerText()).includes('净+'))throw Error(name+': simulated returns leaked before reveal');
            await page.locator('#revealBlind').click();
            if(await page.locator('#compareBody .compare-cell').count()!==2)throw Error(name+': pair/single comparison missing');
            await page.locator('#dailyReviewDetails summary').click();
            if(await page.locator('#dailyReview tbody tr').count()!==14)throw Error(name+': daily profit rows must be 14');
            const sum=await page.locator('#dailyReview .compare-total').innerText();
            if(!sum.includes('55,000.00')||!sum.includes('50,706.76')||!sum.includes('4,293.24'))throw Error(name+': 1000-point settlement mismatch '+sum);
            await page.locator('#tabs button[data-type="goals"]').click();
            await page.locator('#dateLabel').click();
            await page.locator('#calDays button[data-date="2026-10-10"]').click();
            if(!(await page.locator('#plans').innerText()).includes('待结算'))throw Error(name+': cancelled goals pair must be unsettled');
            await page.locator('#revealBlind').click();
            if(!(await page.locator('#plans').innerText()).includes('赛果遮挡'))throw Error(name+': re-mask not applied');
            if((await page.locator('#dailyReview').innerText()).includes('55,000.00'))throw Error(name+': cumulative payouts leaked while masked');
            await page.locator('#dateLabel').click();
            await page.locator('#calDays button[data-date="2026-10-17"]').click();
            await page.screenshot({path:'/tmp/curated-test/'+name+'-page.png',fullPage:true});
            if(errors.length)throw Error(name+': JS errors '+JSON.stringify(errors));
            const details={engine:name,samples:104,firstPlan,dayBefore,dayAfter,modalRows,budgetInput:1000,firstShare,secondShare,errors};
            report.push(details);
            await context.close();
          }
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            try{
              await check(browser,devices['Pixel 7'],'mobile');
              await check(browser,{viewport:{width:1280,height:900},deviceScaleFactor:1},'desktop');
              fs.writeFileSync('/tmp/curated-test/report.json',JSON.stringify({status:'pass',checks:report},null,2));
              console.log(JSON.stringify({status:'PASS',checks:report}));
            }finally{await browser.close();}
          })().catch(e=>{console.error(String(e.stack||e));process.exitCode=1});
          JS
          cd "$GITHUB_WORKSPACE"
          node /tmp/curated-test/check.cjs
      - name: Save screenshots and result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curated-lab-ui-qa
          path: |
            /tmp/curated-test/*-page.png
            /tmp/curated-test/*-modal.png
            /tmp/curated-test/report.json
          if-no-files-found: ignore
