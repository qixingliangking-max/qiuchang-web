<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>球场档案｜登录</title>
  <link rel="stylesheet" href="styles.css?v=20260926login3">
</head>
<body class="auth-login-page">
  <main class="auth-wrap">
    <form class="auth-card" id="loginForm">
      <h1>球场档案</h1>
      <div class="subtitle">赛事数据管家 · 登录你的账户</div>

      <div class="field">
        <label for="loginEmail">邮箱</label>
        <input id="loginEmail" type="email" required autocomplete="email" placeholder="请输入邮箱">
      </div>

      <div class="field">
        <label for="loginPassword">密码</label>
        <input id="loginPassword" type="password" required minlength="8" autocomplete="current-password" placeholder="请输入密码">
      </div>

      <label class="check auth-agreement">
        <input id="loginAgreement" type="checkbox" required>
        <span>我已阅读并同意 <a class="legal-link" href="terms.html" target="_blank" rel="noopener">《用户服务协议》</a> 和 <a class="legal-link" href="privacy.html" target="_blank" rel="noopener">《隐私政策》</a></span>
      </label>

      <button class="primary-btn" type="submit">登录</button>
      <div id="loginHint" class="code-hint"></div>

      <div class="auth-link">还没有账号？ <a href="register.html">立即注册</a></div>
      <div class="auth-utility-row"><a href="forgot-password.html">忘记密码？</a><span>·</span><a href="index.html">返回首页</a></div>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-client.js?v=20260922b"></script>
  <script src="app.js?v=20260923logindiag1"></script>
</body>
</html>
