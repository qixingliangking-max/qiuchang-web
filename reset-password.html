<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>球场档案｜重置密码</title>
  <link rel="stylesheet" href="styles.css?v=20260922access1">
</head>
<body>
  <main class="auth-wrap">
    <form class="auth-card" id="resetPasswordForm">
      <h1>球场档案</h1>
      <div class="subtitle">赛事数据管家 · 设置新密码</div>
      <div id="resetPasswordHint" class="code-hint">正在打开修改密码链接…</div>
      <div class="field">
        <label for="resetPassword">新密码</label>
        <input id="resetPassword" type="password" minlength="8" required autocomplete="new-password" placeholder="至少8个字符">
      </div>
      <div class="field">
        <label for="resetPassword2">确认新密码</label>
        <input id="resetPassword2" type="password" minlength="8" required autocomplete="new-password" placeholder="再次输入新密码">
      </div>
      <button class="primary-btn" type="submit" disabled>确认修改</button>
      <div class="auth-link"><a href="forgot-password.html">重新发送重置邮件</a></div>
      <div class="auth-link"><a href="login.html">返回登录</a></div>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-client.js?v=20260922b"></script>
  <script src="app.js?v=20260926authfallback1"></script>
</body>
</html>
