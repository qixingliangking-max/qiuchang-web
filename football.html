  <meta charset="utf-8">

  <title>球场档案｜竞彩足球</title>

<body class="qc-home qc-football-page">
<div class="shell">
  <header class="header qc-site-header">
    <div class="brand qc-brand-line"><span class="qc-brand-main">球场档案</span><span class="qc-brand-sep">|</span><span class="qc-brand-sub">赛事数据管家</span></div>
    <button class="menu-btn" id="menuBtn" aria-label="账户菜单">☰</button>
  </header>

  <div class="ticker"><div class="ticker-track">官方竞彩足球赛程与固定奖金持续更新；点击任意场次进入比赛详情。</div></div>

  <main class="content">
    <section class="jc-football-toolbar">
      <div id="jcFootballLeagueFilters" class="jc-football-league-filters">
        <button class="active" type="button">全部</button>
      </div>

      <div class="jc-football-date-zone">
        <button id="jcFootballPrevDate" type="button" aria-label="上一天">‹</button>
        <button id="jcFootballDateLabel" class="jc-football-date-label" type="button">读取日期…</button>
        <button id="jcFootballNextDate" type="button" aria-label="下一天">›</button>
        <button id="jcFootballTodayBtn" class="jc-football-today" type="button">返回今日</button>
        <span id="jcFootballCount" class="jc-fixture-count">—</span>
        <div id="jcDatePopover" class="jc-date-popover" hidden></div>
      </div>
    </section>

    <section>
      <div id="jcFootballCards"><div class="profile-card">正在读取竞彩足球赛程…</div></div>
    </section>
  </main>

  <div class="footer-note">竞彩足球数据用于赛事信息展示与研究，请以中国体育彩票官方发布为准。</div>
</div>
