<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>球场档案｜邮箱验证</title><link rel="stylesheet" href="styles.css"></head><body><main class="auth-wrap"><form class="auth-card" id="verifyForm"><h1>球场档案</h1><div class="subtitle">邮箱验证</div><div class="field"><label>邮箱</label><input id="verifyEmail" type="email" required placeholder="请输入注册邮箱"></div><div class="field"><label>验证码</label><input id="verifyCode" inputmode="numeric" autocomplete="one-time-code" maxlength="8" required placeholder="请输入邮箱验证码"></div><button class="primary-btn">完成验证</button><div class="auth-link">验证码有效期以邮件提示为准 · <a href="register.html">返回注册</a></div></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="app.js"></script></body></html>
