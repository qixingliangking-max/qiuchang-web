<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>球场档案｜竞彩足球推理台</title>
<style>
:root{--ink:#14233e;--blue:#2456cc;--line:#e5eaf2;--muted:#7a879a;--bg:#f5f7fb;--mid:#a66c00;--high:#b43e45}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}.head{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 max(16px,calc((100% - 1180px)/2));gap:26px}.brand{font-size:19px;font-weight:900}.brand small{font-size:11px;color:#6a7da6;margin-left:6px}.nav{display:flex;gap:18px;font-size:14px;color:#66758d}.nav b{color:var(--blue);border-bottom:2px solid var(--blue);height:58px;display:flex;align-items:center}main{max-width:1180px;margin:20px auto 60px;padding:0 14px}.tip{background:#fff8e8;color:#745a17;border:1px solid #efddad;padding:10px 13px;border-radius:10px;font-size:13px;line-height:1.55}.toolbar{margin-top:14px;background:white;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.date{font-weight:850;font-size:18px}.date input{border:0;color:inherit;font:inherit;font-weight:850;background:transparent}.filters{display:flex;gap:7px;overflow:auto}.filters span{white-space:nowrap;background:#f1f4f8;border-radius:7px;padding:6px 9px;font-size:12px;color:#607089}.filters span:first-child{background:#e9f0ff;color:var(--blue);font-weight:800}.table{background:white;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:14px}.th,.match{display:grid;grid-template-columns:76px minmax(185px,1.4fr) minmax(180px,1fr) 100px 100px;align-items:center;gap:12px;padding:11px 14px}.th{background:#fafbfd;color:#8a96a8;font-size:12px;font-weight:750;border-bottom:1px solid var(--line)}.match{border-bottom:1px solid #edf0f5;cursor:pointer}.match:last-child{border-bottom:0}.match:hover{background:#fbfcff}.no{font-size:12px;color:#627189;font-weight:800}.league{font-size:11px;color:#718098;margin-bottom:5px}.teams{font-size:14px;font-weight:850}.kick{font-size:11px;color:#8894a5;margin-top:5px}.layers{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.layer{font-size:11px;line-height:1.35}.layer b{display:block;font-size:10px;margin-bottom:3px}.layer.normal{color:#2556c9}.layer.mid{color:var(--mid)}.layer.high{color:var(--high)}.dir,.goals{font-size:13px;font-weight:800}.dir{color:#2456cc}.detail{display:none;grid-column:1/-1;background:#f8faff;border:1px solid #e1e8f7;border-radius:10px;padding:13px;font-size:13px;line-height:1.7;color:#4b5d79}.match.open .detail{display:block}.detail h3{font-size:14px;color:#1e3f91;margin:0 0 6px}.detail p{margin:5px 0}.status{font-size:13px;color:var(--muted);padding:28px;text-align:center}@media(max-width:760px){.head{padding:0 13px}.nav{display:none}main{margin-top:12px}.th{display:none}.match{grid-template-columns:52px 1fr;gap:8px;padding:13px}.layers{grid-column:2}.dir,.goals{display:none}.table{border-radius:10px}.detail{grid-column:1/-1}.toolbar{align-items:flex-start}.date{font-size:16px}.layer{min-width:70px}}
</style></head><body>
<header class="head"><div class="brand">球场档案<small>内部测试</small></div><div class="nav"><b>竞彩足球</b><span>今日简报</span><span>每日图文</span><span>精选方案</span><span>联赛档案</span></div></header>
<main><div class="tip"><b>竞彩足球推理台｜测试页</b>　正常推理为正式锁板的前两条比分；中赔率与高赔率是独立推演层，不写回正式预测、不参与当前命中统计。</div><section class="toolbar"><div class="date"><input id="day" type="date"></div><div class="filters"><span>全部</span><span>英超</span><span>意甲</span><span>德甲</span><span>西甲</span><span>日职</span><span>韩职</span></div></section><section class="table"><div class="th"><span>编号</span><span>赛事 / 对阵</span><span>比分推理</span><span>模型方向</span><span>总进球</span></div><div id="list"><div class="status">正在读取当日锁板……</div></div></section></main>
<script src="../assets/vendor/supabase-js-2.117.3.js"></script><script src="../supabase-config.js"></script><script src="../supabase-client.js?v=20260927autologin1"></script><script>
(()=>{const $=x=>document.getElementById(x),day=$('day'),list=$('list');day.value=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());const esc=x=>String(x??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));const ps=x=>{let m=String(x||'').match(/(\d+)\s*[-:：]\s*(\d+)/);return m?{h:+m[1],a:+m[2],s:m[1]+'-'+m[2]}:null};const res=s=>s.h>s.a?'胜':s.h<s.a?'负':'平';function model(r){let a=r.jc_model_outputs||[];return a.find(x=>x.is_current&&x.is_locked)||a.find(x=>x.is_locked)||a[0]}function pool(r){let o=(r.jc_market_snapshots||[]).find(x=>x.pool_code==='crs')?.outcomes||{};return Object.entries(o).map(([k,v])=>{let m=k.match(/^s(\d{2})s(\d{2})$/);return m&&+v?{h:+m[1],a:+m[2],s:(+m[1])+'-'+(+m[2]),p:+v}:null}).filter(Boolean).sort((a,b)=>a.p-b.p)}function draw(r){let m=model(r);if(!m)return'';let top=(m.top_scores||[]).map(ps).filter(Boolean),dir=String(m.direction||res(top[0]||{h:0,a:0})),normal=top.slice(0,2).map(x=>x.s),p=pool(r),base=top[0]||p[0],want=dir.includes('胜')?'胜':dir.includes('负')?'负':dir.includes('平')?'平':res(base),used=new Set(normal),cand=p.filter(x=>res(x)===want&&!used.has(x.s)),mid=cand[0]||p[0],high=cand.find(x=>x.h+x.a>=Math.max(base.h+base.a,3)+2&&x.p>=10)||cand[cand.length-1]||mid;let id=esc(r.match_num||'—'),league=esc(r.league_short_name||r.league_name||'—'),home=esc(r.home_team_name),away=esc(r.away_team_name),time=esc(String(r.match_time||'').slice(0,5)),goals=esc(m.goal_range||'—');return '<article class="match"><div class="no">'+id+'</div><div><div class="league">'+league+'</div><div class="teams">'+home+' <span style="color:#9aa6b7">vs</span> '+away+'</div><div class="kick">'+time+' · 赛前锁板</div></div><div class="layers"><div class="layer normal"><b>正常推理</b>'+esc(normal.join(' · '))+'</div><div class="layer mid"><b>中赔率</b>'+esc(mid.s)+'</div><div class="layer high"><b>高赔率</b>'+esc(high.s)+'</div></div><div class="dir">'+esc(m.direction||want)+'</div><div class="goals">'+goals+'</div><div class="detail"><h3>'+home+' vs '+away+'｜自动 AI 报告（测试）</h3><p><b>正常推理：</b>'+esc(normal.join('｜'))+'，以锁板的模型方向与正式赛前判断为主线。</p><p><b>中赔率：</b>'+esc(mid.s)+'，从完整比分池中独立筛出的同方向中段路径。</p><p><b>高赔率：</b>'+esc(high.s)+'，在同方向下进入更高总进球档位的放大剧本；仅作挑战层，不影响正式六项。</p></div></article>'}async function load(){list.innerHTML='<div class="status">正在读取当日锁板……</div>';try{let s=await qcSupabase.auth.getSession();if(!s.data.session)throw Error('请先登录球场档案的 Pro 测试账号。');let q=await qcSupabase.from('jc_overview_prediction_snapshots').select('payload').eq('business_date',day.value).limit(1);if(q.error)throw q.error;let rows=q.data?.[0]?.payload?.rows||[];list.innerHTML=rows.map(draw).join('')||'<div class="status">未找到该日锁板。</div>';document.querySelectorAll('.match').forEach(x=>x.addEventListener('click',()=>x.classList.toggle('open')))}catch(e){list.innerHTML='<div class="status">'+esc(e.message||e)+'</div>'}}day.addEventListener('change',load);load()})();
</script></body></html>
