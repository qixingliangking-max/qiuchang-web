<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>球场档案｜独立25场测试</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#172033;font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.top{background:#111a2d;color:white;padding:16px max(20px,calc((100% - 1180px)/2));display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;font-size:18px}.tag{font-size:12px;color:#91a4c8;border:1px solid #354464;border-radius:20px;padding:3px 8px}.wrap{max-width:1180px;margin:auto;padding:28px 20px 50px}.eyebrow{color:#60708f;font-size:12px;letter-spacing:.08em}.head{display:flex;justify-content:space-between;gap:20px;align-items:end;border-bottom:1px solid #dce2ec;padding-bottom:20px}.head h1{margin:5px 0 0;font-size:26px}.head p{margin:6px 0 0;color:#66738b}.method{background:#edf3ff;border-left:3px solid #2b67d1;padding:12px 14px;color:#41506c;font-size:13px;margin:18px 0}.legend{display:flex;gap:16px;color:#56647d;font-size:12px}.pill{font-weight:700;border-radius:5px;padding:4px 7px}.n{color:#1d5ed2;background:#eaf1ff}.m{color:#a65e00;background:#fff3e3}.h{color:#ad2541;background:#ffebef}.row{display:grid;grid-template-columns:70px 1.45fr 1.1fr 1fr 1fr 110px;align-items:center;gap:14px;background:#fff;border:1px solid #e3e8f0;border-radius:10px;padding:16px 18px;margin:9px 0;box-shadow:0 1px 2px #1e2f4b08}.no{font-weight:800;color:#2d68cf}.league{font-size:12px;color:#71809b}.teams{font-weight:700;font-size:16px}.score b{font-size:15px}.score small{display:block;color:#7b879c;margin-top:3px}.goals{font-weight:700}.detail{display:none;grid-column:2/-1;color:#4f5e77;border-top:1px solid #edf0f5;padding-top:12px;margin-top:2px}.row.open .detail{display:block}.row{cursor:pointer}.confidence{font-size:12px;color:#5f6e86;text-align:right}.warn{color:#b36b00}@media(max-width:760px){.top{padding:13px 16px}.wrap{padding:20px 12px}.head{display:block}.legend{margin-top:14px;flex-wrap:wrap}.row{grid-template-columns:44px 1fr 85px;gap:9px;padding:13px}.league{grid-column:2}.score{grid-column:3;grid-row:1/3}.goals,.confidence{display:none}.detail{grid-column:1/-1}.teams{font-size:15px}}
</style></head><body><div class="top"><div class="brand">球场档案 <span class="tag">独立模型测试</span></div><div class="tag">不读取今日锁板</div></div><main class="wrap"><section class="head"><div><div class="eyebrow">2026-10-18 · 25 场独立运行</div><h1>竞彩足球推理台｜自主生成测试</h1><p id="meta">正在载入模型结果…</p></div><div class="legend"><span><i class="pill n">正常</i> 概率前二</span><span><i class="pill m">中赔率</i> 同向扩展</span><span><i class="pill h">高赔率</i> 尾部剧本</span></div></section><div class="method">本页独立取公开赛程，以球队赛季/近期 xG 快照计算主客 λ，生成泊松比分矩阵后输出三层结果。<b>不读取、也不写入</b>当天正式锁板；数据覆盖不足的场次会标为低置信度。</div><section id="list"></section></main><script src="./independent-25-test-data.js"></script><script>
const d=window.QC_INDEPENDENT_25;document.querySelector('#meta').textContent=`模型 ${d.version} · 生成 ${new Date(d.generated_at).toLocaleString('zh-CN',{hour12:false})} · ${d.rows.length} 场`;
const f=(v)=>`<span class="pill ${v==='normal'?'n':v==='medium'?'m':'h'}">${v==='normal'?'正常':v==='medium'?'中赔率':'高赔率'}</span>`;
document.querySelector('#list').innerHTML=d.rows.map(r=>{const low=!r.source_coverage.home||!r.source_coverage.away;return `<article class="row"><div class="no">${r.no}<div class="league">${r.competition}<br>${r.time}</div></div><div class="teams">${r.home} <span style="color:#a8b2c4">vs</span> ${r.away}</div><div class="score">${f('normal')}<b>${r.normal.join(' · ')}</b><small>${r.probability.normal.map(x=>x+'%').join(' / ')}</small></div><div class="score">${f('medium')}<b>${r.medium}</b><small>${r.probability.medium}%</small></div><div class="score">${f('high')}<b>${r.high}</b><small>${r.probability.high}%</small></div><div class="confidence ${low?'warn':''}">${r.direction}<br>${r.goals}<br>${low?'低置信度':'置信 '+r.confidence+'%'}</div><div class="detail"><b>自动报告：</b>主客 λ 为 ${r.lambda_home} / ${r.lambda_away}，基础方向为${r.direction}；正常层取比分矩阵概率最高的 ${r.normal.join('、')}。中赔率 ${r.medium} 保持同向并放大事件，概率 ${r.probability.medium}%；高赔率 ${r.high} 对应更高总进球的尾部剧本，概率 ${r.probability.high}%。${low?' 此场缺少一侧或双方完整快照，仅作模型链路演示。':''}</div></article>`}).join('');document.querySelectorAll('.row').forEach(x=>x.onclick=()=>x.classList.toggle('open'));
</script></body></html>
