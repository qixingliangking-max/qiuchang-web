<body class="qc-demo qc-home qc-football-page">
<div class="shell">
<header class="header qc-site-header">
 <a class="brand qc-brand-line" href="../index.html"><span class="qc-brand-main">球场档案</span><span class="qc-brand-sep">|</span><span class="qc-brand-sub">赛事数据管家</span></a>
 <a href="../football.html" style="font-size:13px;border:1px solid #dfe6f2;padding:10px 13px;border-radius:12px;color:#3764ed;font-weight:800;background:white">正式页面 ↗</a>
</header>
<div class="qc-demo-banner">紧凑列表测试 · 取消大赔率表 · 命中赔率保留 · 正式页不变</div>
<div class="qc-demo-toolbar" aria-label="测试日期切换">
 <button id="qcPrev" class="qc-demo-arrow" aria-label="前一天">‹</button>
 <button id="qcDate" class="qc-demo-current" aria-label="当前测试日期">10-19 周一</button>
 <button id="qcNext" class="qc-demo-arrow" aria-label="后一天">›</button>
 <button id="qcToday" class="qc-demo-today">19号</button>
</div>
<div class="qc-demo-subtitle" id="qcSummary">读取已发布的公开静态赛程…</div>
<main class="qc-demo-main">
 <div id="qcCards" aria-live="polite"><div class="qc-demo-error">正在载入静态赛程…</div></div>
 <p class="qc-demo-footnote">仅展示已公开的赛前预测命中及对应赛前赔率，不包含未公开的Pro预测。点击「玩法详情／玩法结果」进入现有详情页。</p>
</main>

<script src="../assets/team-logos/catalog.js?v=20261017crestready2"></script>
<script>
(function(){
 'use strict';
 var dates=['2026-10-18','2026-10-19','2026-10-20','2026-10-21'];
 var current='2026-10-19';
 var memo=new Map();
 var container=document.getElementById('qcCards');
 var dateLabel=document.getElementById('qcDate');
 var summary=document.getElementById('qcSummary');
 function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&quot;',"'":'&#39;'}[c];});}
 function logoUrl(m,side){
   var name=side==='home'?m.home_team_name:m.away_team_name;
   var raw=side==='home'?m._homeLogoUrl:m._awayLogoUrl;
   var cat=window.QC_TEAM_LOGO_CATALOG||{};
   var path=cat.by_team&&cat.by_team[name]||cat.by_source&&cat.by_source[raw]||raw||'';
   return /^assets\/team-logos\/[a-z0-9-]+\.(png|jpg|jpeg|webp)$/i.test(String(path))?'../'+path:'';
 }
 function team(m,side){
   var home=side==='home';
   var name=String(home?m.home_team_name:m.away_team_name||'');
   var url=logoUrl(m,side);
   var pic=url?'<img src="'+esc(url)+'" alt="" width="29" height="29" loading="eager" decoding="async" onerror="this.style.display=\'none\'">':'<span class="qc-demo-placeholder">'+(home?'主':'客')+'</span>';
   return '<span class="qc-demo-team'+(home?'':' away')+'">'+(home?pic+'<b class="qc-demo-teamname">'+esc(name)+'</b>':'<b class="qc-demo-teamname">'+esc(name)+'</b>'+pic)+'</span>';
 }
 function confirmed(m){
   var raw=m.raw||{},status=String(m.match_status||'')+' '+String(raw.matchStatusName||'');
   return /已结束|完赛|已完成|finished|final/i.test(status)&&/^\d{1,2}[:-]\d{1,2}$/.test(String(raw.sectionsNo999||''))&&/^\d{1,2}[:-]\d{1,2}$/.test(String(raw.sectionsNo1||''));
 }
 function norm(x){return String(x||'').trim().replace(/:/g,'-');}
 function scoredParts(x){
   var match=norm(x).match(/^(\d{1,2})-(\d{1,2})$/);
   return match?[Number(match[1]),Number(match[2])]:null;
 }
 function outcome(x){return x[0]>x[1]?'胜':x[0]<x[1]?'负':'平';}
 // This standalone TEST only illustrates the existing public FT hit layout
 // with independently verifiable locked fields. Production's hit settlement
 // and all odds remain unchanged and authoritative.
 function publicHits(frozen){
   if(!frozen||!confirmed(frozen)) return [];
   var mod=(frozen.jc_model_outputs||[]).find(function(x){return x.stage==='FINAL'&&x.is_locked===true&&x.is_current===true;});
   if(!mod) return [];
   var ft=scoredParts(frozen.raw&&frozen.raw.sectionsNo999);
   var ht=scoredParts(frozen.raw&&frozen.raw.sectionsNo1);
   if(!ft||!ht)return [];
   // Match the existing formal card's locked direction, official pre-kick
   // HAD/HHAD and result-specific odds; never infer or invent price values.
   var kickoff=new Date(frozen.kickoff_at||'').getTime();
   var snapshots=(frozen.jc_market_snapshots||[]).filter(function(p){
     var t=new Date(p.captured_at||0).getTime();
     return !Number.isFinite(kickoff)||!Number.isFinite(t)||t<=kickoff;
   });
   var markets={};
   snapshots.forEach(function(p){
     var old=markets[p.pool_code];
     if(!old||new Date(p.captured_at||0)>new Date(old.captured_at||0))
       markets[p.pool_code]=p;
   });
   function price(pool,key){
     var value=markets[pool]&&markets[pool].outcomes&&markets[pool].outcomes[key];
     if(value&&typeof value==='object')value=value.odds??value.value??value.fixedBonus??value.sp;
     if(value===null||value===undefined||value==='')return null;
     return String(value);
   }
   var list=[];
   function add(kind,label,pool,key){
     var odd=price(pool,key);
     if(odd!==null)list.push({kind:kind,label:label,odds:odd});
   }
   function compactChoices(value){
     var s=String(value||'').replace(/\s/g,'').replace(/[＋+｜|]/g,'/');
     if(/主队?不败/.test(s))return ['胜','平'];
     if(/客队?不败/.test(s))return ['平','负'];
     if(/分胜负/.test(s))return ['胜','负'];
     return s.split('/').map(function(x){return x==='主胜'?'胜':x==='客胜'?'负':x==='平局'?'平':x;});
   }
   var actual=outcome(ft),direction=compactChoices(mod.direction);
   var had=Boolean(markets.had);
   var hhad=markets.hhad;
   if(had&&direction.includes(actual)){
     add('胜平负',actual,'had',{'胜':'h','平':'d','负':'a'}[actual]);
   }else if(!had&&hhad&&hhad.goal_line!=null){
     var handicapLine=Number(hhad.goal_line);
     if(Number.isFinite(handicapLine)){
       var adjusted=ft[0]+handicapLine,handicapActual=adjusted>ft[1]?'让胜':adjusted<ft[1]?'让负':'让平';
       if(direction.includes(handicapActual))add('让球方向',handicapActual,'hhad',{'让胜':'h','让平':'d','让负':'a'}[handicapActual]);
     }
   }
   if(hhad&&hhad.goal_line!=null){
     var line=Number(hhad.goal_line);
     if(Number.isFinite(line)){
       var adjusted=ft[0]+line,ha=adjusted>ft[1]?'让胜':adjusted<ft[1]?'让负':'让平';
       if(compactChoices(mod.handicap_direction).includes(ha))
         add('让球',ha,'hhad',{'让胜':'h','让平':'d','让负':'a'}[ha]);
     }
   }
   var full=norm(frozen.raw.sectionsNo999),top=Array.isArray(mod.top_scores)?mod.top_scores.map(norm):[];
   if(top.includes(full))add('比分',full,'crs','s'+String(ft[0]).padStart(2,'0')+'s'+String(ft[1]).padStart(2,'0'));
   var total=ft[0]+ft[1],goalChoices=String(mod.goal_range||'').match(/[0-7](?:\+)?球/g)||[];
   if(goalChoices.some(function(x){return x===String(total)+'球'||(total>=7&&x.startsWith('7'));}))
     add('总进球',(total>=7?'7+':total)+'球','ttg','s'+Math.min(total,7));
   var htft=outcome(ht)+'/'+actual;
   if([mod.htft_top1,mod.htft_top2].some(function(x){return String(x||'').replace(/\s/g,'')===htft;})){
     var map={'胜/胜':'hh','胜/平':'hd','胜/负':'ha','平/胜':'dh','平/平':'dd','平/负':'da','负/胜':'ah','负/平':'ad','负/负':'aa'};
     add('半全场',htft,'hafu',map[htft]);
   }
   return list;
 }
 function renderRow(m,archived){
   var done=confirmed(m), raw=m.raw||{},result=norm(raw.sectionsNo999),half=norm(raw.sectionsNo1);
   var label=done?'玩法结果':'玩法详情';
   var status=done?'半 '+half:'未开赛';
   var chips=done?publicHits(archived||m):[];
   var hits=chips.length?'<section class="qc-demo-hits"><div class="qc-demo-hit-title">赛前预测命中</div><div class="qc-demo-hitlist">'+chips.map(function(x){return '<span class="qc-demo-chip">'+esc(x.kind)+' '+esc(x.label)+' <span class="qc-demo-chip-odd">@'+esc(x.odds)+'</span></span>';}).join('')+'</div></section>':'';
   var when=String(m.match_date||'').slice(5)+' '+String(m.match_time||'').slice(0,5);
   var href='../jc-match.html?id='+encodeURIComponent(m.id);
   return '<article class="qc-demo-card">'+
    '<a class="qc-demo-all" href="'+href+'" aria-label="'+esc(m.home_team_name)+' 对阵 '+esc(m.away_team_name)+' '+label+'">'+
     '<div class="qc-demo-body">'+
      '<div class="qc-demo-cardtop"><div class="qc-demo-league"><em>'+esc(m.league_short_name||m.league_name||'—')+'</em><b>'+esc(m.match_num||'')+'</b></div><time class="qc-demo-time">'+esc(when)+'</time></div>'+
      '<div class="qc-demo-scoreaxis">'+team(m,'home')+
        '<span class="qc-demo-mid"><strong class="qc-demo-result'+(done?'':' pending')+'">'+(done?esc(result):'VS')+'</strong><small class="qc-demo-ht">'+esc(status)+'</small></span>'+
        team(m,'away')+'</div>'+
      '<div class="qc-demo-divider"></div>'+
     '</div>'+hits+
     '<div class="qc-demo-cta">'+esc(label)+' <span>›</span></div>'+
    '</a></article>';
 }
 async function getJson(path){
   var r=await fetch('../'+path,{cache:'no-cache'});
   if(!r.ok)throw Error('HTTP '+r.status+' '+path);
   return r.json();
 }
 async function day(ds){
   if(memo.has(ds))return memo.get(ds);
   var p=(async function(){
     var [live,history]=await Promise.allSettled([
       getJson('data/overview/live/'+ds+'.json'),
       (async function(){
          var manifest=await getJson('data/overview/manifest.json');
          var f=manifest.dates&&manifest.dates[ds];
          return f&&/^data\/overview\/[\w./-]+\.json$/.test(f)?getJson(f):null;
       })()
     ]);
     var fixtures=live.status==='fulfilled'&&live.value&&Array.isArray(live.value.rows)?live.value.rows:[];
     var finals=history.status==='fulfilled'&&history.value&&Array.isArray(history.value.rows)?history.value.rows:[];
     if(!fixtures.length)fixtures=finals;
     var byId=new Map(finals.map(function(m){return [String(m.id),m];}));
     return {fixtures:fixtures,byId:byId};
   })();
   memo.set(ds,p);
   return p;
 }
 async function show(ds){
   if(!dates.includes(ds))return;
   current=ds;
   var index=dates.indexOf(ds);
   dateLabel.textContent=ds.slice(5)+' '+['周日','周一','周二','周三','周四','周五','周六'][new Date(ds+'T12:00:00+08:00').getUTCDay()];
   document.getElementById('qcPrev').disabled=index===0;
   document.getElementById('qcNext').disabled=index===dates.length-1;
   history.replaceState(null,'','?date='+encodeURIComponent(ds));
   var cached=memo.get(ds);
   if(!cached) container.innerHTML='<div class="qc-demo-error">正在读取已发布静态赛程…</div>';
   try{
     var data=await day(ds);
     if(current!==ds)return;
     var ordered=[...data.fixtures].sort(function(a,b){return String(a.match_num||'').localeCompare(String(b.match_num||''),'zh-CN',{numeric:true});});
     var finished=ordered.filter(confirmed).length;
     summary.textContent=ordered.length+'场比赛 · '+finished+'场完赛 · 命中赔率保留';
     container.innerHTML=ordered.length?ordered.map(function(m){return renderRow(m,data.byId.get(String(m.id)));}).join(''):'<div class="qc-demo-error">本日暂无已发布的赛程。</div>';
   }catch(error){
     if(current===ds){container.innerHTML='<div class="qc-demo-error">静态赛程暂时无法读取，请刷新后重试。</div>';summary.textContent='读取失败';}
     console.warn('竞彩足球手机测试页静态读取异常',error);
   }
 }
 document.getElementById('qcPrev').addEventListener('click',function(){show(dates[dates.indexOf(current)-1]);});
 document.getElementById('qcNext').addEventListener('click',function(){show(dates[dates.indexOf(current)+1]);});
 document.getElementById('qcToday').addEventListener('click',function(){show('2026-10-19');});
 dateLabel.addEventListener('click',function(){show(current==='2026-10-18'?'2026-10-19':'2026-10-18');});
 var requested=new URLSearchParams(location.search).get('date');
 show(dates.includes(requested)?requested:'2026-10-19');
})();
</script>
