<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>球场档案｜会员联系入口内部测试</title>
  <link rel="stylesheet" href="../styles.css?v=20261008ticker1">
  <style>
    body{background:#f6f7f9}
    .qc-contact-test-note{max-width:760px;margin:14px auto 0;padding:10px 14px;border-radius:12px;background:#fff7db;color:#8a591f;font-size:12px;font-weight:800}
    .qc-profile-contact-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 14px;padding:11px 13px;border:1px solid #e3e9f5;border-radius:13px;background:#f8faff}
    .qc-profile-contact-copy{min-width:0}
    .qc-profile-contact-copy strong{display:block;color:#24344f;font-size:14px;line-height:1.35}
    .qc-profile-contact-copy span{display:block;margin-top:4px;color:#8a94a8;font-size:12px;line-height:1.4}
    .qc-profile-contact-btn{flex:0 0 auto;border:0;background:transparent;color:#3764ed;padding:7px 2px;font-weight:900;font-size:13px;cursor:pointer}
    .qc-contact-modal{position:fixed;inset:0;z-index:120;display:grid;place-items:center;padding:20px;background:rgba(24,31,44,.42);backdrop-filter:blur(5px)}
    .qc-contact-modal[hidden]{display:none!important}
    .qc-contact-dialog{width:min(430px,calc(100vw - 30px));box-sizing:border-box;background:#fff;border-radius:24px;padding:28px 22px 22px;box-shadow:0 30px 90px rgba(24,31,44,.28);text-align:center}
    .qc-contact-dialog h2{margin:0;color:#24344f;font-size:25px}
    .qc-contact-dialog .sub{margin:10px 0 18px;color:#7f899d;font-size:14px;line-height:1.7}
    .qc-contact-qr-placeholder{width:min(260px,72vw);aspect-ratio:1;margin:0 auto;border:1.5px solid #dce4f2;border-radius:18px;display:grid;place-items:center;background:#fafbfe;color:#9aa4b6;font-size:13px;font-weight:800;line-height:1.6}
    .qc-contact-label{margin-top:15px;font-weight:900;color:#24344f;font-size:16px}
    .qc-contact-tip{margin-top:8px;color:#98a2b3;font-size:12px}
    .qc-contact-test-tag{margin:18px 0 0;padding:12px 14px;border-radius:13px;background:#fff8f8;border:1px solid #f2d0d0;color:#596274;font-size:13px}
    .qc-contact-test-tag b{color:#d83a34;font-size:16px}
    .qc-contact-actions{display:grid;grid-template-columns:1fr 1.2fr;gap:12px;margin-top:20px}
    .qc-contact-actions button{height:48px;border-radius:13px;font-weight:900;font-size:15px;cursor:pointer}
    .qc-contact-cancel{background:#fff;border:1px solid #dce3ee;color:#707b8f}
    .qc-contact-ok{background:#3764ed;border:0;color:#fff}
    @media(max-width:560px){
      .content{padding-top:18px!important}
      .qc-contact-dialog{padding:24px 18px 18px;border-radius:22px}
      .qc-profile-contact-row{padding:10px 12px}
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="header qc-site-header">
      <a class="brand qc-brand-line" href="../index.html"><span class="qc-brand-main">球场档案</span><span class="qc-brand-sep">|</span><span class="qc-brand-sub">赛事数据管家</span></a>
      <button class="menu-btn" type="button">测试</button>
    </header>

    <div class="qc-contact-test-note">内部测试页｜不加入正式导航｜当前只验证会员联系入口的布局与交互</div>

    <main class="content">
      <h1>个人中心</h1>

      <section class="profile-card">
        <h2>基本信息</h2>
        <div class="kv"><span>用户名</span><strong>测试用户</strong></div>
        <div class="kv"><span>邮箱</span><strong>test@example.com</strong></div>
        <div class="kv"><span>角色</span><strong>基础用户</strong></div>
        <div class="kv"><span>账号状态</span><strong style="color:#58a877">正常</strong></div>
      </section>

      <section class="profile-card">
        <h2>会员订阅</h2>
        <p><span class="pill blue">基础用户</span> <span style="color:var(--muted)">未开通 Pro</span></p>
        <p style="color:var(--muted)">有效期至：未开通</p>

        <div class="qc-profile-contact-row">
          <div class="qc-profile-contact-copy">
            <strong>没有兑换码？</strong>
            <span>可直接联系客服开通 Pro</span>
          </div>
          <button id="qcContactProBtn" class="qc-profile-contact-btn" type="button">联系客服</button>
        </div>

        <form class="inline-form" onsubmit="event.preventDefault()">
          <input autocomplete="off" placeholder="输入兑换码">
          <button type="submit">兑换</button>
        </form>
      </section>

      <section class="profile-card">
        <h2>修改昵称</h2>
        <form class="inline-form" onsubmit="event.preventDefault()">
          <input maxlength="30" placeholder="输入昵称">
          <button type="submit">保存昵称</button>
        </form>
      </section>
    </main>
  </div>

  <div id="qcContactModal" class="qc-contact-modal" hidden>
    <div class="qc-contact-dialog" role="dialog" aria-modal="true" aria-labelledby="qcContactTitle">
      <h2 id="qcContactTitle">联系客服开通 Pro</h2>
      <div class="sub">扫描客服二维码，了解会员开通与兑换码获取方式。</div>
      <div class="qc-contact-qr-placeholder">客服二维码占位<br>正式上线前替换真实二维码</div>
      <div class="qc-contact-label">官方客服</div>
      <div class="qc-contact-tip">长按二维码可保存到手机相册</div>
      <div class="qc-contact-test-tag">添加好友时请备注：<b>球场档案</b></div>
      <div class="qc-contact-actions">
        <button id="qcContactCancel" class="qc-contact-cancel" type="button">取消</button>
        <button id="qcContactOk" class="qc-contact-ok" type="button">知道了</button>
      </div>
    </div>
  </div>

  <script>
    const modal=document.getElementById('qcContactModal');
    const open=()=>{modal.hidden=false;document.body.style.overflow='hidden'};
    const close=()=>{modal.hidden=true;document.body.style.overflow=''};
    document.getElementById('qcContactProBtn').onclick=open;
    document.getElementById('qcContactCancel').onclick=close;
    document.getElementById('qcContactOk').onclick=close;
    modal.onclick=e=>{if(e.target===modal) close()};
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden) close()});
  </script>
</body>
</html>
