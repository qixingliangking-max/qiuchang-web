<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>球场档案｜精选方案测试</title><style>
:root{--ink:#17233a;--muted:#72809a;--line:#e7ebf1;--blue:#275bc9;--bg:#f5f7fb;--accent:#f4a123}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.bar{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 max(16px,calc((100% - 1100px)/2));gap:28px}.brand{font-weight:900;font-size:19px}.brand i{font-style:normal;color:#6680b8;font-weight:700;font-size:11px;margin-left:7px}.nav{display:flex;gap:20px;color:#66758d;font-size:14px}.nav b{height:58px;display:flex;align-items:center;color:var(--blue);border-bottom:2px solid var(--blue)}main{max-width:1100px;margin:25px auto 65px;padding:0 14px}.intro{background:linear-gradient(125deg,#172d59,#2859b9);color:#fff;border-radius:16px;padding:24px 26px;display:flex;justify-content:space-between;gap:20px;align-items:center}.intro h1{font-size:25px;margin:0 0 5px}.intro p{margin:0;color:#cddafd}.date{font-size:13px;color:#d6e2ff;text-align:right}.tabs{display:flex;gap:8px;margin:18px 0 12px}.tabs button{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:18px;color:#65728a;font:inherit;cursor:pointer}.tabs button.active{background:#eaf0ff;color:#2455bd;border-color:#dbe5ff;font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px 18px;cursor:pointer;transition:.15s}.card:hover{transform:translateY(-1px);box-shadow:0 8px 25px #203a6d10}.top{display:flex;justify-content:space-between;gap:8px}.meta{font-size:12px;color:#74809a}.label{color:#936000;background:#fff5df;border-radius:5px;padding:3px 7px;font-size:11px;font-weight:800}.teams{font-size:18px;font-weight:900;margin:11px 0 14px}.items{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;border-top:1px solid #edf0f4;padding-top:12px}.items span{color:#74809a;font-size:11px}.items b{display:block;font-size:14px;color:#25365a;margin-top:3px}.card .more{margin-top:13px;color:#2d5ec7;font-size:12px;font-weight:800}.empty{background:#fff;border:1px solid var(--line);border-radius:12px;padding:35px;text-align:center;color:#8290a8}.detail{display:none;margin-top:15px;background:#fff;border:1px solid #dbe4f2;border-radius:14px;padding:21px 22px}.detail.show{display:block}.detail h2{margin:0 0 3px;font-size:19px}.detail .sub{color:#7a879d;font-size:12px}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.fact{background:#f7f9fc;border-radius:9px;padding:10px}.fact small{display:block;color:#78869c}.fact b{display:block;margin-top:3px}.report{border-top:1px solid var(--line);padding-top:14px;color:#46536a;line-height:1.75}.report p{margin:5px 0}.notice{margin-top:14px;color:#7d899d;font-size:12px;text-align:center}@media(max-width:720px){.bar{padding:0 13px}.nav{display:none}main{margin-top:14px}.intro{padding:20px;display:block}.intro h1{font-size:21px}.date{text-align:left;margin-top:10px}.grid{grid-template-columns:1fr}.facts{grid-template-columns:1fr 1fr}.items{grid-template-columns:repeat(3,1fr)}}
</style></head><body><header class="bar"><div class="brand">球场档案<i>内部测试</i></div><nav class="nav"><span>竞彩足球</span><span>今日简报</span><span>每日图文</span><b>精选方案</b><span>联赛档案</span></nav></header><main><section class="intro"><div><h1>今日精选方案</h1><p>从当日模型输出中按方向一致性、路径完整度和数据覆盖进行人工复核后的研究清单。</p></div><div class="date" id="date">读取中</div></section><div class="tabs"><button class="active">今日精选</button><button>历史回看</button><button>方案说明</button></div><section class="grid" id="cards"><div class="empty">正在读取今日研究清单…</div></section><section class="detail" id="detail"></section><div class="notice">测试页：只展示研究信息，不提供交易入口；不影响正式竞彩足球页面与当日锁板。</div></main><script src="../assets/vendor/supabase-js-2.117.3.js"></script><script src="../supabase-config.js"></script><script src="../supabase-client.js?v=20260927autologin1"></script><script>
(()=>{const $=x=>document.getElementById(x),cards=$('cards'),detail=$('detail'),target=['阿贾克斯','阿森纳','尤文图斯','里昂'];const esc=x=>String(x??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));const findModel=r=>{let a=r.jc_model_outputs||[];return a.find(x=>x.is_current&&x.is_locked)||a.find(x=>x.is_locked)||a[0]};const choose=rows=>{let picked=rows.filter(r=>target.some(n=>String(r.home_team_name).includes(n)||String(r.away_team_name).includes(n)));return picked.length?picked.slice(0,4):rows.filter(r=>findModel(r)).slice(0,4)};function card(r,i){let m=findModel(r),scores=(m?.top_scores||[]).slice(0,3).join('｜')||'—',dir=m?.direction||'—',goals=m?.goal_range||'—';return `<article class="card" data-i="${i}"><div class="top"><div class="meta">${esc(r.match_num||'精选')} · ${esc(r.league_short_name||r.league_name||'')}</div><span class="label">方案 ${String(i+1).padStart(2,'0')}</span></div><div class="teams">${esc(r.home_team_name)} <span style="color:#a7b1c0">vs</span> ${esc(r.away_team_name)}</div><div class="items"><div><span>主方向</span><b>${esc(dir)}</b></div><div><span>总进球</span><b>${esc(goals)}</b></div><div><span>TOP3</span><b>${esc(scores)}</b></div></div><div class="more">查看方案拆解 →</div></article>`}function open(r,i){let m=findModel(r),normal=(m?.top_scores||[]).slice(0,3).join('｜')||'—',dir=m?.direction||'—',htft=[m?.htft_top1,m?.htft_top2].filter(Boolean).join('｜')||'—';detail.innerHTML=`<h2>方案 ${String(i+1).padStart(2,'0')}｜${esc(r.home_team_name)} vs ${esc(r.away_team_name)}</h2><div class="sub">${esc(r.league_short_name||r.league_name||'')} · ${esc(String(r.match_time||'').slice(0,16))} · 赛前研究版</div><div class="facts"><div class="fact"><small>模型方向</small><b>${esc(dir)}</b></div><div class="fact"><small>半全场路径</small><b>${esc(htft)}</b></div><div class="fact"><small>TOP3比分</small><b>${esc(normal)}</b></div></div><div class="report"><p><b>方案理由：</b>本场进入精选，核心不是单一比分，而是模型方向、半全场路径与总进球区间能形成同一比赛脚本。</p><p><b>比赛可能怎么走：</b>先按 ${esc(dir)} 的主路径推进，再以 ${esc(m?.goal_range||'总进球区间')} 控制节奏预期；${esc(normal)} 是符合该路径的比分序列，而不是孤立结论。</p><p><b>使用说明：</b>该页只归档人工复核后的研究方案；正式六项数据仍以竞彩足球详情页当日锁板为准。</p></div>`;detail.classList.add('show');detail.scrollIntoView({behavior:'smooth',block:'nearest'})}async function load(){try{const day=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());$('date').textContent=day+' · 今日研究清单';let s=await qcSupabase.auth.getSession();if(!s.data.session)throw Error('请先登录球场档案的 Pro 测试账号。');let q=await qcSupabase.from('jc_overview_prediction_snapshots').select('payload').eq('business_date',day).limit(1);if(q.error)throw q.error;let data=choose(q.data?.[0]?.payload?.rows||[]);if(!data.length)throw Error('今日暂无可展示的研究方案。');cards.innerHTML=data.map(card).join('');cards.querySelectorAll('.card').forEach((el,i)=>el.onclick=()=>open(data[i],i))}catch(e){cards.innerHTML='<div class="empty">'+esc(e.message||e)+'</div>'}}load()})();
</script></body></html>
