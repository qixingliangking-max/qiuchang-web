<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>球场档案｜数据采集中心</title>
<link rel="stylesheet" href="styles.css?v=20260923adminusers1">
</head>
<body>
<div class="shell">
<header class="header">
<div class="brand">球场档案<span>·Admin</span></div>
<a class="small-btn" href="admin.html">返回后台</a>
</header>
<main class="content">
<h1>数据采集中心</h1>
<section class="profile-card">
<h2>采集状态</h2>
<div class="admin-grid">
<div class="metric"><b>暂停</b><span>当前状态</span></div>
<div class="metric"><b>保留</b><span>历史数据</span></div>
<div class="metric"><b>—</b><span>最近同步</span></div>
<div class="metric"><b>—</b><span>异常记录</span></div>
</div>
</section>
<section class="profile-card">
<h2>数据源管理</h2>
<p style="color:var(--muted);line-height:1.7">当前采集模块保留，不参与日常运行。后续可恢复采集、切换数据源或查看同步日志。</p>
<div class="kv"><span>竞彩数据采集</span><strong>已保留</strong></div>
<div class="kv"><span>自动同步</span><strong>未启用</strong></div>
</section>
<section class="profile-card">
<h2>历史记录</h2>
<table class="brief-table">
<thead><tr><th>时间</th><th>类型</th><th>状态</th></tr></thead>
<tbody><tr><td colspan="3">暂无新的采集任务</td></tr></tbody>
</table>
</section>
</main>
</div>
</body>
</html>
