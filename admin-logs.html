<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>球场档案｜系统活动</title>
  <link rel="stylesheet" href="styles.css?v=20260923adminops1">
  <style>
    .qc-activity-page{padding-top:18px}
    .qc-activity-title{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
    .qc-activity-title h1{margin:0 0 6px;font-size:24px}
    .qc-activity-title .admin-note{margin:0;line-height:1.6}
    .qc-activity-title>.small-btn{flex-shrink:0}
    .qc-activity-stats{margin-bottom:14px}
    .qc-activity-panel{margin-top:12px}
    .qc-activity-panel h2{margin-top:0}
    .qc-activity-filters{display:flex;gap:7px;flex-wrap:wrap}
    .qc-activity-filters button{border:1px solid #dce3f0;background:#f7f9fd;color:#40516d;border-radius:10px;padding:8px 11px;font-weight:750;cursor:pointer;font-size:13px}
    .qc-activity-filters button.active{background:#eaf0ff;border-color:#90a9ed;color:#204a9e}
    .qc-activity-filters button:focus-visible{outline:2px solid #739cf0;outline-offset:2px}
    .qc-activity-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:12px 0}
    .qc-activity-toolbar .admin-note{margin:0}
    .qc-activity-panel .admin-table-wrap{overflow-x:auto}
    .qc-activity-panel .brief-table{min-width:760px}
    .qc-activity-panel .brief-table td{vertical-align:top;line-height:1.55}
    .qc-activity-panel .brief-table td:nth-child(4){min-width:225px;word-break:break-word}
    .qc-activity-more{text-align:center;margin-top:14px}
    .qc-activity-error{background:#fff3f2;color:#a33c39;border-radius:10px;padding:10px;margin-bottom:10px}
    .qc-activity-disclaimer{margin-top:16px;line-height:1.75}
    @media(max-width:640px){
      .qc-activity-page{padding:12px 12px 56px}
      .qc-activity-title h1{font-size:21px}
      .qc-activity-title>.small-btn{padding:8px 11px}
      .qc-activity-filters button{padding:8px 10px}
      .qc-activity-stats{gap:10px}
      .qc-activity-stats .metric{padding:13px;border-radius:14px}
      .qc-activity-stats .metric b{font-size:25px}
    }
  </style>
  <link rel="stylesheet" href="admin-subpages.css?v=20261019adminsub1">
</head>
<body class="qc-admin-subpage">
  <div class="shell">
    <header class="header qc-admin-header">
      <a class="brand" href="admin.html" aria-label="返回球场档案后台">球场档案<span>·Admin</span></a>
      <a class="qc-admin-return" href="admin.html">← 返回后台</a>
    </header>

    <main class="content qc-activity-page" id="adminLogsRoot">
      <section class="qc-admin-intro qc-activity-title">
        <div>
          <span class="qc-admin-kicker">系统</span>
          <h1>系统活动</h1>
          <p class="admin-note">账号、每日活跃、竞彩采集、比分同步与会员兑换记录，仅管理员可见。</p>
        </div>
        <button type="button" class="qc-admin-quiet-btn" id="adminLogRefresh">刷新记录</button>
      </section>

      <div class="admin-grid qc-activity-stats">
        <div class="metric"><b id="logLoadedCount">—</b><span>本次已加载</span></div>
        <div class="metric"><b id="logSignupCount">—</b><span>本页注册记录</span></div>
        <div class="metric"><b id="logLoginCount">—</b><span>本页登录快照</span></div>
        <div class="metric"><b id="logCollectorCount">—</b><span>本页竞彩采集</span></div>
      </div>

      <section class="profile-card qc-activity-panel">
        <h2>真实事件记录</h2>
        <div class="qc-activity-filters" id="adminLogTypes" aria-label="活动类型">
          <button type="button" data-type="ops" class="active">常规活动</button>
          <button type="button" data-type="signup">用户注册</button>
          <button type="button" data-type="login">最近登录</button>
          <button type="button" data-type="activity">每日活跃</button>
          <button type="button" data-type="collector">竞彩采集</button>
          <button type="button" data-type="score">比分同步</button>
          <button type="button" data-type="code">会员兑换</button>
        </div>
        <div class="qc-activity-toolbar">
          <div class="qc-activity-filters" id="adminLogDays" aria-label="时间范围">
            <button type="button" data-days="1">近24小时</button>
            <button type="button" data-days="7" class="active">近7天</button>
            <button type="button" data-days="30">近30天</button>
            <button type="button" data-days="0">全部历史</button>
          </div>
          <span id="adminLogMeta" class="admin-note" role="status" aria-live="polite">等待管理员验证…</span>
        </div>
        <div id="adminLogError" class="admin-note qc-activity-error" role="alert" hidden></div>
        <div class="admin-table-wrap">
          <table class="brief-table">
            <thead><tr><th>北京时间</th><th>分类</th><th>事件</th><th>真实明细</th><th>状态</th><th>来源</th></tr></thead>
            <tbody id="adminLogRows"><tr><td colspan="6">正在验证管理员权限…</td></tr></tbody>
          </table>
        </div>
        <div class="qc-activity-more">
          <button type="button" class="small-btn" id="adminLogMore" hidden>加载更多记录</button>
        </div>
        <p class="admin-note qc-activity-disclaimer">说明：最近登录只保存每个账号最后一次登录时间，不代表完整登录流水；每日活跃是按天汇总。比分同步次数较多，需单独选择「比分同步」。系统未保存的操作无法还原为历史事件。</p>
      </section>
    </main>
  </div>
  <script src="assets/vendor/supabase-js-2.117.3.js"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-client.js?v=20260927autologin1"></script>
  <script src="admin-operations.js?v=20261015activityv2"></script>
</body>
</html>
