<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>球场档案｜系统活动</title>
  <link rel="stylesheet" href="styles.css?v=20260923adminops1">
</head>
<body>
  <div class="shell">
    <header class="header">
      <div class="brand">球场档案<span>·Admin</span></div>
      <a class="small-btn" href="admin.html" style="display:flex;align-items:center">返回后台</a>
    </header>

    <main class="content" id="adminLogsRoot">
      <h1>系统活动</h1>
      <div class="admin-grid">
        <div class="metric"><b id="logSignupCount">—</b><span>最近注册记录</span></div>
        <div class="metric"><b id="logLoginCount">—</b><span>最近登录记录</span></div>
        <div class="metric"><b id="logCollectorCount">—</b><span>采集记录</span></div>
        <div class="metric"><b>150</b><span>最多显示</span></div>
      </div>

      <section class="profile-card" style="margin-top:20px">
        <p class="admin-note">这里显示已经到达系统的注册、最近登录和采集活动。若用户网络在到达 Supabase 前就中断，后台不会产生对应记录。</p>
        <div class="admin-table-wrap">
          <table class="brief-table">
            <thead><tr><th>时间</th><th>类型</th><th>事件</th><th>详情</th><th>状态</th></tr></thead>
            <tbody id="adminLogRows"><tr><td colspan="5">正在读取…</td></tr></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-client.js?v=20260922k"></script>
  <script src="app.js?v=20260923adminops1"></script>
</body>
</html>
