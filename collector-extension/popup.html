<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>球场档案·竞彩采集器</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>球场档案·竞彩采集器 <span class="ver">0.1.3</span></h1>
    <p class="sub">主线路读取中国竞彩网；500.com 只作为备用测试源。</p>

    <label>采集器凭证</label>
    <input id="tokenInput" type="password" autocomplete="off" placeholder="qc_col_...">
    <button id="saveTokenBtn" class="secondary">保存凭证</button>

    <div class="row">
      <label class="switch-row">
        <input id="autoSync" type="checkbox">
        <span>每15分钟自动同步官方竞彩</span>
      </label>
    </div>

    <button id="syncBtn" class="primary">测试官方竞彩页</button>
    <button id="sync500Btn" class="backup">测试 500.com 竞彩页</button>

    <section class="status">
      <b>最近状态</b>
      <div id="statusText">尚未测试</div>
      <small id="statusDetail"></small>
    </section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
