<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>球场档案·竞彩采集器</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>球场档案·竞彩采集器</h1>
    <p class="sub">使用你当前电脑的浏览器网络读取中国竞彩网官方数据，再写入球场档案数据库。</p>

    <label>采集器凭证</label>
    <input id="tokenInput" type="password" autocomplete="off" placeholder="qc_col_...">
    <button id="saveTokenBtn" class="secondary">保存凭证</button>

    <div class="row">
      <label class="switch-row">
        <input id="autoSync" type="checkbox">
        <span>每15分钟自动同步</span>
      </label>
    </div>

    <button id="syncBtn" class="primary">立即同步</button>
    <button id="openBtn" class="secondary">打开中国竞彩网</button>

    <section class="status">
      <b>状态</b>
      <div id="statusText">尚未同步</div>
      <small id="statusDetail"></small>
    </section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
