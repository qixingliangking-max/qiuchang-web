<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>球场档案｜找回密码</title>
  <link rel="stylesheet" href="styles.css?v=20260922access1">
</head>
<body>
  <main class="auth-wrap">
    <form class="auth-card" id="forgotPasswordForm">
      <h1>球场档案</h1>
      <div class="subtitle">赛事数据管家 · 找回密码</div>
      <p style="margin:0 0 18px;color:var(--muted);line-height:1.7">输入注册邮箱，我们会发送安全的密码重置链接。</p>
      <div class="field">
        <label for="forgotEmail">邮箱</label>
        <input id="forgotEmail" type="email" required autocomplete="email" placeholder="请输入注册邮箱">
      </div>
      <button class="primary-btn" type="submit">发送重置邮件</button>
      <div id="forgotHint" class="code-hint"></div>
      <div class="auth-link"><a href="login.html">返回登录</a></div>
      <div class="auth-link"><a href="index.html">返回首页</a></div>
      <div class="legal-mini"><a href="terms.html" target="_blank" rel="noopener">用户服务协议</a><span>·</span><a href="privacy.html" target="_blank" rel="noopener">隐私政策</a></div>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-client.js?v=20260922b"></script>
  <script src="app.js?v=20260922recovery1"></script>
</body>
</html>
