<script>
  // Public-only first paint for same-tab list → detail navigation.
  // Official app.js replaces this placeholder; no Pro data or claims are cached.
  (()=>{
    try{
      const q=new URLSearchParams(location.search);
      const id=q.get('id');
      if(!id || !/^[0-9a-f-]{36}$/i.test(id)) return;
      const saved=JSON.parse(sessionStorage.getItem('qc-football-detail-nav-v1')||'null');
      const m=saved?.match;
      if(!saved || !m || !Array.isArray(saved.day) ||
        Date.now()-Number(saved.savedAt)>45000 ||
        saved.businessDate!==m.business_date ||
        String(m.id)!==id ||
        !saved.day.some(row=>String(row.id)===id)) return;

      const root=document.getElementById('jcMatchDetailRoot');
      if(!root) return;
      const el=(tag,cls,value)=>{
        const node=document.createElement(tag);
        if(cls) node.className=cls;
        if(value!==undefined) node.textContent=String(value||'');
        return node;
      };
      const layout=el('div','jc-detail-layout');
      layout.dataset.qcPublicFirstPaint='1';
      const aside=el('aside','jc-detail-sidebar');
      const asideHead=el('div','jc-detail-sidebar-head');
      const back=el('a','');
      back.href='football.html?date='+encodeURIComponent(saved.businessDate);
      back.textContent='‹ 返回赛事';
      asideHead.append(back,el('b','',saved.day.length+' 场'));
      aside.append(asideHead);
      layout.append(aside);

      const main=el('section','jc-detail-main');
      const head=el('div','detail-head jc-odds-headcard');
      const top=el('div','match-top');
      top.append(el('span','',(m.match_num||'')+' · '+(m.league_name||m.league_short_name||'—')),
                 el('span','',(m.match_date||'')+' '+String(m.match_time||'').slice(0,5)));
      head.append(top);
      const title=el('div','detail-title jc-odds-matchup');
      title.style.marginTop='18px';
      const home=el('div','team-badge jc-detail-team jc-detail-team-home',m.home_team_name||'—');
      const center=el('div','center-score');
      // Yesterday's immutable publicly settled HT/FT can paint immediately
      // from the already visible archive row. Never expose any locked model,
      // AI report, odds or inferred result before official status is known.
      const status=String(m.match_status||m.raw?.matchStatusName||'');
      const ft=String(m.raw?.sectionsNo999||'').trim();
      const ht=String(m.raw?.sectionsNo1||'').trim();
      const finished=/(已结束|完场|完赛|FT|FINISHED)/i.test(status) &&
        /^\d{1,2}[-:]\d{1,2}$/.test(ft) &&
        /^\d{1,2}[-:]\d{1,2}$/.test(ht);
      center.append(
        el('strong',finished?'jc-detail-score-finished':'',
          finished?ft.replace(':','-'):'VS'),
        el('small','',finished?'半 '+ht.replace(':','-'):'读取比赛状态…')
      );
      const away=el('div','team-badge right jc-detail-team jc-detail-team-away',m.away_team_name||'—');
      title.append(home,center,away);
      head.append(title);
      main.append(head);
      const loading=el('div','jc-match-loading-shell compact','比赛详情加载中…');
      loading.setAttribute('role','status');
      main.append(loading);
      layout.append(main);
      root.replaceChildren(layout);
    }catch(_){ /* Missing/storage-blocked handoff keeps the old safe loader. */ }
  })();
</script>
