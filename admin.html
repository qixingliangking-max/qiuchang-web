<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>球场档案｜Admin</title>
  <link rel="stylesheet" href="styles.css?v=20260923adminops1">
  <style>
    /* Only the admin dashboard: compact nav and no redundant page heading. */
    body.qc-admin-dashboard .qc-admin-header{
      height:62px;
      padding:0 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      background:#fff;
      border-bottom:1px solid var(--line);
    }
    body.qc-admin-dashboard .qc-admin-header .brand{
      font-size:21px;
      font-weight:900;
      letter-spacing:-.35px;
      line-height:1.25;
      white-space:nowrap;
    }
    body.qc-admin-dashboard .qc-admin-header .brand span{
      font-size:15px;
      margin-left:2px;
      color:var(--blue);
    }
    body.qc-admin-dashboard .qc-admin-return{
      display:inline-flex;
      justify-content:center;
      align-items:center;
      height:38px;
      flex-shrink:0;
      padding:0 13px;
      border:1px solid #dfe5f0;
      border-radius:11px;
      background:#fff;
      color:#42516e;
      font-size:14px;
      font-weight:800;
      white-space:nowrap;
    }
    body.qc-admin-dashboard .qc-admin-return:focus-visible,
    body.qc-admin-dashboard .qc-admin-header .brand:focus-visible{
      outline:3px solid #91a8f8;
      outline-offset:3px;
    }
    body.qc-admin-dashboard #adminRoot{
      padding-top:18px;
      padding-bottom:70px;
    }
    body.qc-admin-dashboard #adminRoot>.admin-grid{margin-top:0}
    body.qc-admin-dashboard #adminRoot>.admin-module-grid{margin-top:14px}
    body.qc-admin-dashboard #adminModelRecordLink[hidden]{display:none!important}
    @media(max-width:640px){
      body.qc-admin-dashboard .qc-admin-header{
        height:56px;
        padding:0 13px;
      }
      body.qc-admin-dashboard .qc-admin-header .brand{font-size:18px}
      body.qc-admin-dashboard .qc-admin-header .brand span{font-size:13px}
      body.qc-admin-dashboard .qc-admin-return{
        height:36px;
        padding:0 11px;
        font-size:13px;
      }
      body.qc-admin-dashboard #adminRoot{
        padding:12px 12px 64px;
      }
      body.qc-admin-dashboard #adminRoot>.admin-grid{gap:10px}
      body.qc-admin-dashboard #adminRoot>.admin-grid .metric{
        padding:14px;
        border-radius:16px;
      }
      body.qc-admin-dashboard #adminRoot>.admin-grid .metric b{font-size:26px}
      body.qc-admin-dashboard #adminRoot>.admin-module-grid{margin-top:12px}
    }
  </style>
</head>
<body class="qc-admin-dashboard">
  <div class="shell">
    <header class="header qc-admin-header">
      <a class="brand" href="index.html" aria-label="返回球场档案首页">球场档案<span>·Admin</span></a>
      <a class="qc-admin-return" href="profile.html">← 个人中心</a>
    </header>

    <main class="content" id="adminRoot">
      <div class="admin-grid">
        <div class="metric"><b id="adminUsers">—</b><span>有效用户</span></div>
        <div class="metric"><b id="adminProUsers">—</b><span>Pro会员</span></div>
        <div class="metric"><b id="adminUnusedCodes">—</b><span>可用兑换码</span></div>
        <div class="metric"><b id="adminUsedCodes">—</b><span>已使用兑换码</span></div>
      </div>

      <div class="admin-module-grid">
        <a class="admin-module-card" href="admin-users.html?v=20261007daily2">
          <div><span class="admin-module-kicker">账号</span><h2>用户管理</h2></div>
          <p><b id="adminTodayNew">—</b> 今日新增 · <b id="adminLogin24h">—</b> 24小时活跃</p>
          <strong>查看用户数据 ›</strong>
        </a>

        <a class="admin-module-card" href="admin-codes.html?v=20261007codes2">
          <div><span class="admin-module-kicker">会员</span><h2>兑换码管理</h2></div>
          <p>生成 Pro 兑换码、查看使用记录与状态。</p>
          <strong>生成 / 查看兑换码 ›</strong>
        </a>

        <a class="admin-module-card" href="admin-data.html">
          <div><span class="admin-module-kicker">数据</span><h2>数据采集中心</h2></div>
          <p id="adminCollectorSummary">历史保留 · 正在读取状态…</p>
          <strong>查看采集数据 ›</strong>
        </a>

        <a class="admin-module-card" href="admin-logs.html">
          <div><span class="admin-module-kicker">系统</span><h2>系统活动</h2></div>
          <p id="adminLogSummary">正在读取最近活动…</p>
          <strong>查看系统活动 ›</strong>
        </a>

        <a class="admin-module-card" id="adminModelRecordLink" href="model-record-test.html" hidden>
          <div><span class="admin-module-kicker">研究</span><h2>模型档案</h2></div>
          <p>近7天、近30天、上线以来 · 六项赛后命中统计。</p>
          <strong>查看模型档案 ›</strong>
        </a>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-client.js?v=20260927autologin1"></script>
  <script src="admin-home.js?v=20261015adminrecord1"></script>
</body>
</html>
