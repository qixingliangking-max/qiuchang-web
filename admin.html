<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>球场档案｜后台管理</title>
  <link rel="stylesheet" href="styles.css?v=20260923adminops1">
</head>
<body>
  <div class="shell">
    <header class="header">
      <div class="brand">球场档案<span>·Admin</span></div>
      <a class="small-btn" href="profile.html" style="display:flex;align-items:center">返回个人中心</a>
    </header>

    <main class="content" id="adminRoot">
      <h1>后台管理</h1>

      <div class="admin-grid">
        <div class="metric"><b id="adminUsers">—</b><span>有效用户</span></div>
        <div class="metric"><b id="adminProUsers">—</b><span>Pro会员</span></div>
        <div class="metric"><b id="adminUnusedCodes">—</b><span>可用兑换码</span></div>
        <div class="metric"><b id="adminUsedCodes">—</b><span>已使用兑换码</span></div>
      </div>

      <div class="admin-module-grid">
        <a class="admin-module-card" href="admin-users.html">
          <div><span class="admin-module-kicker">账号</span><h2>用户管理</h2></div>
          <p><b id="adminTodayNew">—</b> 今日新增 · <b id="adminLogin24h">—</b> 24小时登录</p>
          <strong>查看用户数据 ›</strong>
        </a>

        <a class="admin-module-card" href="admin-codes.html">
          <div><span class="admin-module-kicker">会员</span><h2>兑换码管理</h2></div>
          <p>生成 Pro 兑换码、查看使用记录与状态。</p>
          <strong>生成 / 查看兑换码 ›</strong>
        </a>

        <a class="admin-module-card" href="admin-data.html">
          <div><span class="admin-module-kicker">数据</span><h2>数据采集中心</h2></div>
          <p id="adminCollectorSummary">历史保留 · 正在读取状态…</p>
          <strong>查看采集数据 ›</strong>
        </a>

        <a class="admin-module-card" href="admin-logs.html">
          <div><span class="admin-module-kicker">系统</span><h2>系统活动</h2></div>
          <p id="adminLogSummary">正在读取最近活动…</p>
          <strong>查看系统活动 ›</strong>
        </a>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-client.js?v=20260922k"></script>
  <script src="app.js?v=20260926authrls2"></script>
</body>
</html>
