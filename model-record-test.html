<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=20260928logo1">
  <title>球场档案｜模型档案测试</title>
  <link rel="stylesheet" href="styles.css?v=20260930headertest5">
  <style>
    body.qc-model-record-test{background:#f5f7fb;color:#1f2a44}
    .qc-record-test-main{max-width:1180px;margin:0 auto;padding:18px 18px 54px}
    .qc-record-hero{background:linear-gradient(135deg,#fff,#f7f9fd);border:1px solid #e4e9f1;border-radius:18px;padding:22px 24px;box-shadow:0 5px 20px rgba(31,42,68,.04)}
    .qc-record-kicker{display:flex;align-items:center;gap:8px;color:#6f7d93;font-size:12px;font-weight:800;margin-bottom:8px}
    .qc-record-test-badge{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:999px;background:#eef4ff;color:#3c6cb4;font-size:11px;font-weight:900}
    .qc-record-hero h1{margin:0;font-size:28px;line-height:1.2;letter-spacing:-.02em}
    .qc-record-hero p{margin:9px 0 0;color:#738097;font-size:14px;line-height:1.65}
    .qc-record-summary-line{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}
    .qc-record-summary-line span{display:inline-flex;align-items:center;min-height:30px;padding:0 10px;border-radius:9px;background:#f2f5f9;color:#536178;font-size:12px;font-weight:800}
    .qc-record-controls{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 12px}
    .qc-record-range-tabs{display:flex;gap:6px;padding:4px;background:#e9edf4;border-radius:12px}
    .qc-record-range-tabs button{border:0;background:transparent;color:#657289;height:34px;padding:0 14px;border-radius:9px;font-size:13px;font-weight:800;cursor:pointer}
    .qc-record-range-tabs button.active{background:#fff;color:#1f2a44;box-shadow:0 1px 5px rgba(31,42,68,.08)}
    .qc-record-note{color:#8994a6;font-size:12px;text-align:right}
    .qc-record-metrics{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:20px}
    .qc-record-metric{background:#fff;border:1px solid #e4e9f1;border-radius:15px;padding:15px 14px;min-width:0}
    .qc-record-metric small{display:block;color:#7c889d;font-size:12px;font-weight:800;margin-bottom:7px}
    .qc-record-metric strong{display:block;font-size:24px;line-height:1;color:#1f2a44;letter-spacing:-.03em}
    .qc-record-metric em{display:block;margin-top:7px;color:#8994a6;font-size:11px;font-style:normal}
    .qc-record-section-title{display:flex;align-items:center;gap:8px;margin:22px 0 10px;font-size:18px;font-weight:950}
    .qc-record-section-title:before{content:"";width:4px;height:22px;border-radius:999px;background:#59b77a}
    .qc-record-day{background:#fff;border:1px solid #e2e8f0;border-radius:16px;overflow:hidden;margin-bottom:14px}
    .qc-record-day-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;background:#fbfcfe;border-bottom:1px solid #edf1f5}
    .qc-record-day-title{display:flex;align-items:baseline;gap:8px}
    .qc-record-day-title strong{font-size:16px}
    .qc-record-day-title span{font-size:12px;color:#8994a6}
    .qc-record-day-stats{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:5px}
    .qc-record-day-stats span{font-size:10px;color:#6e7a90;background:#f0f3f7;border-radius:6px;padding:4px 6px;font-weight:800}
    .qc-record-match-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:12px}
    .qc-record-match-card{border:1px solid #e8edf4;border-radius:14px;background:#fff;overflow:hidden}
    .qc-record-match-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:12px 13px;background:#fbfcfe;border-bottom:1px solid #edf1f5}
    .qc-record-num-badge{font-size:13px;font-weight:950;color:#34425a;background:#eef2f7;border-radius:8px;padding:6px 7px}
    .qc-record-team-block{min-width:0}
    .qc-record-team-block b{display:block;font-size:14px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .qc-record-team-block small{display:block;margin-top:4px;color:#929caf;font-size:10px}
    .qc-record-score-box{text-align:right;min-width:48px}
    .qc-record-score-box strong{display:block;font-size:22px;line-height:1;color:#1f2a44}
    .qc-record-score-box small{display:block;margin-top:4px;color:#98a2b4;font-size:10px}
    .qc-record-match-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0}
    .qc-record-metric-item{position:relative;min-width:0;padding:11px 12px;border-top:1px solid #f0f3f6;border-right:1px solid #f0f3f6}
    .qc-record-metric-item:nth-child(3n){border-right:0}
    .qc-record-metric-item small{display:block;color:#8a95a8;font-size:10px;font-weight:850;margin-bottom:5px}
    .qc-record-metric-item b{display:block;color:#27344d;font-size:12px;line-height:1.35;padding-right:36px;white-space:normal;word-break:keep-all}
    .qc-record-metric-item .qc-record-state{position:absolute;right:8px;top:9px}
    .qc-record-state{display:inline-flex;align-items:center;justify-content:center;height:19px;border-radius:999px;padding:0 6px;font-size:9px;font-weight:950}
    .qc-record-state.hit{background:#e9f7ee;color:#238552}
    .qc-record-state.miss{background:#fff0ef;color:#c04c43}
    .qc-record-state.pending{background:#f0f2f5;color:#8b95a7}
    .qc-record-gate,.qc-record-loading{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:38px 20px;text-align:center;color:#66748b;margin-top:18px}
    .qc-record-gate h2{margin:0 0 8px;color:#26344d}
    .qc-record-gate a{display:inline-flex;margin-top:14px;background:#263d66;color:#fff;text-decoration:none;border-radius:10px;padding:10px 16px;font-weight:850}
    .qc-record-empty{padding:24px;text-align:center;color:#8894a7}
    .qc-record-legend{display:flex;gap:12px;flex-wrap:wrap;color:#8590a3;font-size:11px;margin:8px 0 0}
    .qc-record-legend span{display:inline-flex;align-items:center;gap:4px}
    @media(max-width:900px){
      .qc-record-test-main{padding:12px 10px 42px}
      .qc-record-hero{padding:15px 14px;border-radius:14px}
      .qc-record-hero h1{font-size:22px}
      .qc-record-hero p{font-size:12px}
      .qc-record-controls{align-items:flex-start;flex-direction:column}
      .qc-record-note{text-align:left}
      .qc-record-metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
      .qc-record-metric{padding:11px 10px;border-radius:12px}
      .qc-record-metric strong{font-size:20px}
      .qc-record-day-head{align-items:flex-start;flex-direction:column;padding:12px}
      .qc-record-day-stats{justify-content:flex-start}
      .qc-record-match-list{grid-template-columns:1fr;gap:9px;padding:9px}
      .qc-record-match-head{padding:11px}
      .qc-record-match-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
      .qc-record-metric-item:nth-child(3n){border-right:1px solid #f0f3f6}
      .qc-record-metric-item:nth-child(2n){border-right:0}
      .qc-record-metric-item{padding:10px 10px}
      .qc-record-metric-item b{font-size:11px;padding-right:32px}
      .qc-record-team-block b{font-size:13px}
      .qc-record-score-box strong{font-size:20px}

      /* Match the locked mobile header/navigation proportions used on the main site. */
      .qc-site-header{height:54px!important;padding:0 14px!important}
      .qc-brand-line{gap:5px!important}
      .qc-brand-line .qc-brand-main{font-size:19px!important;line-height:1!important}
      .qc-brand-line .qc-brand-sep{font-size:14px!important;line-height:1!important}
      .qc-brand-line .qc-brand-sub{font-size:12.5px!important;line-height:1!important}
      .qc-site-header .menu-btn{width:68px!important;height:40px!important;padding:0!important;display:flex!important;align-items:center!important;justify-content:center!important;border:0!important;background:transparent!important;box-shadow:none!important}
      .qc-site-header .menu-btn:before{content:"";position:absolute;width:64px;height:30px;border:1px solid #e1e6ee;border-radius:8px;background:#fff;z-index:-1}
      .qc-site-header .menu-btn{position:relative;gap:4px!important;color:#34415a!important}
      .qc-site-header .menu-btn .qc-menu-label{font-size:12px!important;font-weight:700!important;line-height:1!important}
      .qc-site-header .menu-btn .qc-menu-icon{font-size:15px!important;font-weight:700!important;line-height:1!important}
      .drawer{top:54px!important}
    }
    @media(max-width:420px){
      .qc-record-range-tabs{width:100%}
      .qc-record-range-tabs button{flex:1;padding:0 8px}
      .qc-record-summary-line{gap:6px}
      .qc-record-summary-line span{font-size:11px}
    }
  </style>
</head>

<div class="shell">
  <header class="header qc-site-header">
    <a class="brand qc-brand-line" href="index.html" aria-label="返回今日速览"><span class="qc-brand-main">球场档案</span><span class="qc-brand-sep">|</span><span class="qc-brand-sub">赛事数据管家</span></a>
    <nav class="qc-desktop-nav" aria-label="主导航">

  </header>

  <main class="qc-record-test-main">
    <section class="qc-record-hero">
      <div class="qc-record-kicker"><span class="qc-record-test-badge">隐藏测试页</span><span>暂未加入网站导航</span></div>
      <h1>模型档案</h1>
      <p>汇总网站上线以来已经锁板的赛前记录，并用完赛比分统一核验。只统计已完赛且具备对应核验条件的项目。</p>
      <div class="qc-record-summary-line" id="recordSummaryLine">
        <span>正在读取上线记录…</span>
      </div>
    </section>

    <div id="modelRecordRoot">
      <div class="qc-record-loading">正在生成模型档案…</div>
    </div>
  </main>

  <div class="footer-note">测试页仅用于核对统计口径与页面设计；未完赛场次不计入命中率。</div>
