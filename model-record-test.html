<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=20260928logo1">
  <title>球场档案｜模型档案测试</title>
  <link rel="stylesheet" href="styles.css?v=20260930headertest5">
  <style>
    body.qc-model-record-test{background:#f5f7fb;color:#1f2a44}
    .qc-record-test-main{max-width:1180px;margin:0 auto;padding:18px 18px 54px}
    .qc-record-hero{background:linear-gradient(135deg,#fff,#f7f9fd);border:1px solid #e4e9f1;border-radius:18px;padding:22px 24px;box-shadow:0 5px 20px rgba(31,42,68,.04)}
    .qc-record-kicker{display:flex;align-items:center;gap:8px;color:#6f7d93;font-size:12px;font-weight:800;margin-bottom:8px}
    .qc-record-test-badge{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:999px;background:#eef4ff;color:#3c6cb4;font-size:11px;font-weight:900}
    .qc-record-hero h1{margin:0;font-size:28px;line-height:1.2;letter-spacing:-.02em}
    .qc-record-hero p{margin:9px 0 0;color:#738097;font-size:14px;line-height:1.65}
    .qc-record-summary-line{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}
    .qc-record-summary-line span{display:inline-flex;align-items:center;min-height:30px;padding:0 10px;border-radius:9px;background:#f2f5f9;color:#536178;font-size:12px;font-weight:800}
    .qc-record-controls{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 12px}
    .qc-record-range-tabs{display:flex;gap:6px;padding:4px;background:#e9edf4;border-radius:12px}
    .qc-record-range-tabs button{border:0;background:transparent;color:#657289;height:34px;padding:0 14px;border-radius:9px;font-size:13px;font-weight:800;cursor:pointer}
    .qc-record-range-tabs button.active{background:#fff;color:#1f2a44;box-shadow:0 1px 5px rgba(31,42,68,.08)}
    .qc-record-note{color:#8994a6;font-size:12px;text-align:right}
    .qc-record-metrics{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:20px}
    .qc-record-metric{background:#fff;border:1px solid #e4e9f1;border-radius:15px;padding:15px 14px;min-width:0}
    .qc-record-metric small{display:block;color:#7c889d;font-size:12px;font-weight:800;margin-bottom:7px}
    .qc-record-metric strong{display:block;font-size:24px;line-height:1;color:#1f2a44;letter-spacing:-.03em}
    .qc-record-metric em{display:block;margin-top:7px;color:#8994a6;font-size:11px;font-style:normal}
    .qc-record-section-title{display:flex;align-items:center;gap:8px;margin:22px 0 10px;font-size:18px;font-weight:950}
    .qc-record-section-title:before{content:"";width:4px;height:22px;border-radius:999px;background:#59b77a}
    .qc-record-day{background:#fff;border:1px solid #e2e8f0;border-radius:16px;overflow:hidden;margin-bottom:12px}
    .qc-record-day-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;background:#fbfcfe;border-bottom:1px solid #edf1f5}
    .qc-record-day-title{display:flex;align-items:baseline;gap:8px}
    .qc-record-day-title strong{font-size:16px}
    .qc-record-day-title span{font-size:12px;color:#8994a6}
    .qc-record-day-stats{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:5px}
    .qc-record-day-stats span{font-size:10px;color:#6e7a90;background:#f0f3f7;border-radius:6px;padding:4px 6px;font-weight:800}
    .qc-record-match{display:grid;grid-template-columns:58px 92px minmax(230px,1.3fr) repeat(6,minmax(92px,.8fr));align-items:stretch;border-top:1px solid #edf1f5}
    .qc-record-match:first-child{border-top:0}
    .qc-record-cell{padding:11px 8px;border-left:1px solid #f0f3f6;display:flex;align-items:center;justify-content:center;text-align:center;min-width:0}
    .qc-record-cell:first-child{border-left:0}
    .qc-record-num{font-weight:950;color:#34425a}
    .qc-record-score{display:flex;flex-direction:column;gap:3px}
    .qc-record-score strong{font-size:18px}
    .qc-record-score small{font-size:10px;color:#909aad}
    .qc-record-teams{justify-content:flex-start;text-align:left;gap:7px}
    .qc-record-teams b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .qc-record-teams span{font-size:11px;color:#9aa4b5;white-space:nowrap}
    .qc-record-pick{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:100%}
    .qc-record-pick small{font-size:10px;color:#8a95a8;font-weight:800}
    .qc-record-pick b{font-size:12px;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .qc-record-state{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:20px;border-radius:999px;padding:0 6px;font-size:10px;font-weight:950}
    .qc-record-state.hit{background:#e9f7ee;color:#238552}
    .qc-record-state.miss{background:#fff0ef;color:#c04c43}
    .qc-record-state.pending{background:#f0f2f5;color:#8b95a7}
    .qc-record-gate,.qc-record-loading{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:38px 20px;text-align:center;color:#66748b;margin-top:18px}
    .qc-record-gate h2{margin:0 0 8px;color:#26344d}
    .qc-record-gate a{display:inline-flex;margin-top:14px;background:#263d66;color:#fff;text-decoration:none;border-radius:10px;padding:10px 16px;font-weight:850}
    .qc-record-empty{padding:24px;text-align:center;color:#8894a7}
    .qc-record-legend{display:flex;gap:12px;flex-wrap:wrap;color:#8590a3;font-size:11px;margin:8px 0 0}
    .qc-record-legend span{display:inline-flex;align-items:center;gap:4px}
    @media(max-width:900px){
      .qc-record-test-main{padding:12px 10px 42px}
      .qc-record-hero{padding:16px 15px;border-radius:14px}
      .qc-record-hero h1{font-size:22px}
      .qc-record-controls{align-items:flex-start;flex-direction:column}
      .qc-record-note{text-align:left}
      .qc-record-metrics{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
      .qc-record-metric{padding:12px 10px;border-radius:12px}
      .qc-record-metric strong{font-size:21px}
      .qc-record-day-head{align-items:flex-start;flex-direction:column}
      .qc-record-day-stats{justify-content:flex-start}
      .qc-record-match{grid-template-columns:42px 62px minmax(150px,1fr);grid-template-areas:
        "num score teams"
        "direction single handicap"
        "htft goals top"}
      .qc-record-match>.qc-record-cell:nth-child(1){grid-area:num}
      .qc-record-match>.qc-record-cell:nth-child(2){grid-area:score}
      .qc-record-match>.qc-record-cell:nth-child(3){grid-area:teams}
      .qc-record-match>.qc-record-cell:nth-child(4){grid-area:direction}
      .qc-record-match>.qc-record-cell:nth-child(5){grid-area:single}
      .qc-record-match>.qc-record-cell:nth-child(6){grid-area:handicap}
      .qc-record-match>.qc-record-cell:nth-child(7){grid-area:htft}
      .qc-record-match>.qc-record-cell:nth-child(8){grid-area:goals}
      .qc-record-match>.qc-record-cell:nth-child(9){grid-area:top}
      .qc-record-cell{padding:9px 6px}
      .qc-record-match>.qc-record-cell:nth-child(n+4){border-top:1px solid #f0f3f6}
      .qc-record-teams b{font-size:12px}
      .qc-record-pick b{font-size:11px}
    }
    @media(max-width:420px){
      .qc-record-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
      .qc-record-range-tabs{width:100%}
      .qc-record-range-tabs button{flex:1;padding:0 8px}
      .qc-record-match{grid-template-columns:38px 56px minmax(0,1fr)}
    }
  </style>
</head>
